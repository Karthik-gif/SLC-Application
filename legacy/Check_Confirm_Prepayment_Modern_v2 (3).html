<script type="text/javascript">
(function(){
var MODEL=JSON.parse(document.getElementById("prepaymentPayload").innerHTML);
var DATA=MODEL.records;
var columns=MODEL.columns;
var statuses=MODEL.statuses;
var state={
  page:1,pageSize:15,selectedId:null,sortIndex:-1,sortDirection:"asc",
  calendarDate:new Date(2026,8,10),calendarMode:"days",calendarYear:2026
};
function byId(id){return document.getElementById(id)}
function esc(value){
  var text=String(value==null?"":value);
  text=text.replace(/&/g,"&amp;");
  text=text.replace(/</g,"&lt;");
  text=text.replace(/>/g,"&gt;");
  return text.replace(/"/g,"&quot;")
}
function money(value){
  var number=Number(value||0);
  var parts=number.toFixed(2).split(".");
  parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return parts.join(".")
}
function parseDate(text){
  var match=String(text||"").match(/^(\d{2})-(\d{2})-(\d{4})$/);
  var date;
  if(!match){return null}
  date=new Date(Number(match[3]),Number(match[2])-1,Number(match[1]));
  if(date.getFullYear()!==Number(match[3])){return null}
  if(date.getMonth()!==Number(match[2])-1){return null}
  if(date.getDate()!==Number(match[1])){return null}
  return date
}
function formatDate(date){
  var day=("0"+date.getDate()).slice(-2);
  var month=("0"+(date.getMonth()+1)).slice(-2);
  return day+"-"+month+"-"+date.getFullYear()
}
function isValidDate(text){return parseDate(text)!==null}
function setStatus(text){byId("statusText").innerHTML=esc(text)}
function toast(message){
  var region=byId("toastRegion");
  var box=document.createElement("div");
  var icon=document.createElement("div");
  var body=document.createElement("div");
  box.className="toast";
  icon.className="toast-icon";
  icon.innerHTML="OK";
  body.innerHTML='<div class="toast-title">Success</div><div class="toast-message">'+esc(message)+'</div>';
  box.appendChild(icon);
  box.appendChild(body);
  region.appendChild(box);
  window.setTimeout(function(){
    if(box.parentNode){box.parentNode.removeChild(box)}
  },4200)
}
function uniqueCompanies(){
  var seen={};
  var list=[];
  var i,row;
  for(i=0;i<DATA.length;i++){
    row=DATA[i];
    if(!seen[row.companyCode]){
      seen[row.companyCode]=true;
      list.push({code:row.companyCode,name:row.companyName})
    }
  }
  return list
}
function renderCompanyOptions(){
  var list=uniqueCompanies();
  var html='<option value="">Select Company Code</option>';
  var i;
  for(i=0;i<list.length;i++){
    html+='<option value="'+esc(list[i].code)+'">'+esc(list[i].name)+'</option>'
  }
  byId("companyCode").innerHTML=html
}
function renderStatusOptions(){
  var html="";
  var i;
  for(i=0;i<statuses.length;i++){
    html+='<option value="'+esc(statuses[i].code)+'">'+esc(statuses[i].label)+'</option>'
  }
  byId("statusFilter").innerHTML=html
}
function statusSettledValue(code){
  var i;
  for(i=0;i<statuses.length;i++){
    if(statuses[i].code===code){return !!statuses[i].settled}
  }
  return false
}
function readyToLoad(){
  return byId("companyCode").value!==""&&isValidDate(byId("keyDate").value)
}
function rowMatchesKeyDate(row,keyDate){
  var start=parseDate(row.startDate);
  var end=parseDate(row.endDate);
  if(!keyDate){return true}
  if(start&&keyDate<start){return false}
  if(end&&keyDate>end){return false}
  return true
}
function getFilteredRows(){
  var company=byId("companyCode").value;
  var transaction=byId("transactionFilter").value.toLowerCase();
  var settled=statusSettledValue(byId("statusFilter").value);
  var keyDate=parseDate(byId("keyDate").value);
  var rows=[];
  var i,row;
  for(i=0;i<DATA.length;i++){
    row=DATA[i];
    if(company&&row.companyCode!==company){continue}
    if(transaction&&String(row.transaction).toLowerCase().indexOf(transaction)<0){continue}
    if(!!row.settled!==settled){continue}
    if(!rowMatchesKeyDate(row,keyDate)){continue}
    rows.push(row)
  }
  if(state.sortIndex>=0){sortRows(rows,state.sortIndex,state.sortDirection)}
  return rows
}
function sortRows(rows,index,direction){
  var column=columns[index];
  rows.sort(function(a,b){
    var av=a[column.key];
    var bv=b[column.key];
    if(column.type==="number"){
      av=Number(av||0);
      bv=Number(bv||0)
    }else if(column.type==="date"){
      av=parseDate(av);
      bv=parseDate(bv)
    }else{
      av=String(av||"").toLowerCase();
      bv=String(bv||"").toLowerCase()
    }
    if(av<bv){return direction==="asc"?-1:1}
    if(av>bv){return direction==="asc"?1:-1}
    return 0
  })
}
function headerHtml(){
  var html='<tr><th style="width:64px">Select</th>';
  var i,column,cls;
  for(i=0;i<columns.length;i++){
    column=columns[i];
    cls="";
    if(state.sortIndex===i){cls=state.sortDirection==="asc"?"sort-asc":"sort-desc"}
    html+='<th class="'+cls+'" data-index="'+i+'" style="width:'+column.width+'px">';
    html+=esc(column.label);
    html+='<span class="sort-arrows"><span class="sort-up"></span><span class="sort-down"></span></span>';
    html+="</th>"
  }
  return html+"</tr>"
}
function renderTable(){
  var rows=getFilteredRows();
  var start=(state.page-1)*state.pageSize;
  var pages=Math.max(1,Math.ceil(rows.length/state.pageSize));
  var end,i,j,row,column,html="",pageRows,value,cls;
  if(state.page>pages){state.page=pages;start=(state.page-1)*state.pageSize}
  end=Math.min(start+state.pageSize,rows.length);
  pageRows=rows.slice(start,end);
  byId("prepaymentHead").innerHTML=headerHtml();
  for(i=0;i<pageRows.length;i++){
    row=pageRows[i];
    cls=row.settled?"settled":"";
    if(String(row.id)===String(state.selectedId)){cls+=(cls?" ":"")+"selected"}
    html+='<tr data-id="'+row.id+'" class="'+cls+'">';
    html+='<td class="select-cell"><input type="radio" name="prepaymentPick" value="'+row.id+'"';
    if(String(row.id)===String(state.selectedId)){html+=' checked="checked"'}
    html+='></td>';
    for(j=0;j<columns.length;j++){
      column=columns[j];
      value=row[column.key];
      html+='<td class="'+(column.type==="number"?"number":"")+'">';
      if(column.type==="number"){html+=esc(money(value))}
      else{html+=esc(value)}
      html+="</td>"
    }
    html+="</tr>"
  }
  if(!html){
    html='<tr><td colspan="'+(columns.length+1)+'" class="empty">';
    html+="No prepayment records match the current selection.</td></tr>"
  }
  byId("prepaymentBody").innerHTML=html;
  byId("recordCount").innerHTML=rows.length+" record"+(rows.length===1?"":"s");
  renderPagination(rows.length);
  updateActionState();
  bindHeaderSort()
}
function renderPagination(total){
  var bar=byId("paginationBar");
  var pages=Math.max(1,Math.ceil(total/state.pageSize));
  var html='<button class="page-btn" data-page="prev" type="button"';
  var p,startPage,endPage;
  html+=state.page===1?' disabled="disabled"':'';
  html+='>&lt;</button>';
  startPage=Math.max(1,state.page-1);
  endPage=Math.min(pages,startPage+2);
  startPage=Math.max(1,endPage-2);
  for(p=startPage;p<=endPage;p++){
    html+='<button class="page-btn'+(p===state.page?' active':'')+'" data-page="'+p+'" type="button">'+p+'</button>'
  }
  html+='<button class="page-btn" data-page="next" type="button"';
  html+=state.page===pages?' disabled="disabled"':'';
  html+='>&gt;</button>';
  bar.innerHTML=html
}
function findRowById(id){
  var i;
  for(i=0;i<DATA.length;i++){
    if(String(DATA[i].id)===String(id)){return DATA[i]}
  }
  return null
}
function selectedRow(){return findRowById(state.selectedId)}
function clearSelection(){
  state.selectedId=null;
  byId("editBtn").disabled=true;
  byId("settleBtn").disabled=true;
  byId("selectionMeta").innerHTML="Select one line item"
}
function updateActionState(){
  var row=selectedRow();
  if(!row){
    byId("editBtn").disabled=true;
    byId("settleBtn").disabled=true;
    byId("selectionMeta").innerHTML="Select one line item";
    return
  }
  byId("editBtn").disabled=false;
  byId("settleBtn").disabled=!!row.settled;
  byId("selectionMeta").innerHTML=row.settled?"Selected prepayment is already settled":"1 line item selected"
}
function loadResults(){
  if(!readyToLoad()){
    byId("resultsArea").className="";
    clearSelection();
    setStatus("Select Company Code and enter Key Date in DD-MM-YYYY format");
    return
  }
  state.page=1;
  clearSelection();
  byId("resultsArea").className="open";
  renderTable();
  setStatus("Prepayment records loaded")
}
function refreshFilters(){
  if(!readyToLoad()){loadResults();return}
  state.page=1;
  clearSelection();
  renderTable()
}
function bindHeaderSort(){
  var headers=byId("prepaymentHead").getElementsByTagName("th");
  var i;
  for(i=0;i<headers.length;i++){
    headers[i].onclick=function(){
      var index=parseInt(this.getAttribute("data-index"),10);
      if(isNaN(index)){return}
      if(state.sortIndex===index){
        state.sortDirection=state.sortDirection==="asc"?"desc":"asc"
      }else{
        state.sortIndex=index;
        state.sortDirection="asc"
      }
      state.page=1;
      clearSelection();
      renderTable()
    }
  }
}
function openSettleModal(){
  var row=selectedRow();
  if(!row||row.settled){return}
  byId("settleText").innerHTML="Are you sure you want to settle Transaction <b>";
  byId("settleText").innerHTML+=esc(row.transaction)+"</b>?";
  byId("settleModal").className="modal-bg open"
}
function closeSettleModal(){byId("settleModal").className="modal-bg"}
function settleSelected(){
  var row=selectedRow();
  var transaction;
  if(!row||row.settled){closeSettleModal();return}
  transaction=row.transaction;
  row.settled=true;
  closeSettleModal();
  toast("Prepayment Transaction "+transaction+" settled successfully.");
  setStatus("Prepayment Transaction "+transaction+" settled successfully");
  clearSelection();
  renderTable()
}
function monthNames(){
  return ["January","February","March","April","May","June","July","August","September","October","November","December"]
}
function shortMonthNames(){
  return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]
}
function renderCalendar(){
  if(state.calendarMode==="years"){renderYearPanel();return}
  renderDayPanel()
}
function renderDayPanel(){
  var target=state.calendarDate;
  var year=target.getFullYear();
  var month=target.getMonth();
  var selected=parseDate(byId("keyDate").value);
  var first=new Date(year,month,1);
  var firstCell=new Date(year,month,1-first.getDay());
  var names=monthNames();
  var week=["Su","Mo","Tu","We","Th","Fr","Sa"];
  var html='<div class="calendar-head">';
  var i,cell,cls;
  html+='<button class="cal-title-btn" data-cal="title" type="button">'+names[month]+" "+year+"</button>";
  html+='<div class="cal-navs">';
  html+='<button class="cal-nav cal-nav-up" data-cal="prev" type="button" aria-label="Previous month"></button>';
  html+='<button class="cal-nav cal-nav-down" data-cal="next" type="button" aria-label="Next month"></button>';
  html+="</div></div><div class=\"calendar-weekdays\">";
  for(i=0;i<week.length;i++){html+="<span>"+week[i]+"</span>"}
  html+='</div><div class="calendar-days">';
  for(i=0;i<42;i++){
    cell=new Date(firstCell.getFullYear(),firstCell.getMonth(),firstCell.getDate()+i);
    cls="calendar-day";
    if(cell.getMonth()!==month){cls+=" other-month"}
    if(selected&&sameDate(selected,cell)){cls+=" selected"}
    html+='<button class="'+cls+'" data-date="'+formatDate(cell)+'" type="button">'+cell.getDate()+"</button>"
  }
  html+='</div><div class="calendar-foot">';
  html+='<button class="cal-link" data-cal="clear" type="button">Clear</button>';
  html+='<button class="cal-link" data-cal="today" type="button">Today</button>';
  html+="</div>";
  byId("calendarPopup").innerHTML=html
}
function renderYearPanel(){
  var names=monthNames();
  var shortNames=shortMonthNames();
  var selected=parseDate(byId("keyDate").value);
  var month=state.calendarDate.getMonth();
  var year=state.calendarYear;
  var html='<div class="calendar-head">';
  var y,m,cls;
  html+='<button class="cal-title-btn" data-cal="title" type="button">'+names[month]+" "+year+"</button>";
  html+='<div class="cal-navs"></div></div><div id="yearPanel" class="year-panel">';
  for(y=2022;y<=2034;y++){
    html+='<div class="year-row'+(y===year?' active':'')+'">';
    html+='<button class="year-btn" data-year="'+y+'" type="button">'+y+"</button>";
    if(y===year){
      html+='<div class="month-grid">';
      for(m=0;m<12;m++){
        cls="month-btn";
        if(selected&&selected.getFullYear()===y&&selected.getMonth()===m){cls+=" selected"}
        html+='<button class="'+cls+'" data-month="'+m+'" type="button">'+shortNames[m]+"</button>"
      }
      html+="</div>"
    }
    html+="</div>"
  }
  html+="</div>";
  byId("calendarPopup").innerHTML=html;
  window.setTimeout(scrollActiveYear,0)
}
function scrollActiveYear(){
  var panel=byId("yearPanel");
  var active;
  if(!panel){return}
  active=panel.querySelector?panel.querySelector(".year-row.active"):null;
  if(active){panel.scrollTop=Math.max(0,active.offsetTop-34)}
}
function sameDate(a,b){
  return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()
}
function openCalendar(){
  var parsed=parseDate(byId("keyDate").value);
  if(parsed){
    state.calendarDate=parsed;
    state.calendarYear=parsed.getFullYear()
  }
  state.calendarMode="days";
  renderCalendar();
  byId("calendarPopup").className="calendar-popup open"
}
function closeCalendar(){
  state.calendarMode="days";
  byId("calendarPopup").className="calendar-popup"
}
function buildTransactionList(){
  var list=byId("transactionList");
  var company=byId("companyCode").value;
  var settled=statusSettledValue(byId("statusFilter").value);
  var typed=byId("transactionFilter").value.toLowerCase();
  var keyDate=parseDate(byId("keyDate").value);
  var seen={};
  var html="";
  var i,row,value;
  for(i=0;i<DATA.length;i++){
    row=DATA[i];
    if(company&&row.companyCode!==company){continue}
    if(!!row.settled!==settled){continue}
    if(!rowMatchesKeyDate(row,keyDate)){continue}
    value=String(row.transaction);
    if(typed&&value.toLowerCase().indexOf(typed)<0){continue}
    if(seen[value]){continue}
    seen[value]=true;
    html+='<button class="combo-option" data-txn="'+esc(value)+'" type="button">'+esc(value)+"</button>"
  }
  if(!html){html='<div class="combo-empty">No matching transactions</div>'}
  list.innerHTML=html
}
function openTransactionList(){
  buildTransactionList();
  byId("transactionList").className="combo-list open"
}
function closeTransactionList(){byId("transactionList").className="combo-list"}
renderCompanyOptions();
renderStatusOptions();
byId("companyCode").onchange=function(){
  byId("transactionFilter").value="";
  closeTransactionList();
  loadResults()
};
byId("keyDate").onchange=loadResults;
byId("keyDate").onkeyup=function(){
  if(String(this.value).length===10){loadResults()}
};
byId("filterToggle").onclick=function(){
  var body=byId("filterBody");
  var open=body.className.indexOf("open")>=0;
  body.className=open?"filter-body":"filter-body open"
};
byId("transactionFilter").onkeyup=function(){
  refreshFilters();
  openTransactionList()
};
byId("transactionFilter").onclick=openTransactionList;
byId("transactionDropBtn").onclick=function(){
  var list=byId("transactionList");
  if(list.className.indexOf("open")>=0){closeTransactionList()}
  else{openTransactionList()}
};
byId("transactionList").onclick=function(e){
  var target=e.target||e.srcElement;
  var value=target.getAttribute("data-txn");
  if(!value){return}
  byId("transactionFilter").value=value;
  closeTransactionList();
  refreshFilters()
};
byId("statusFilter").onchange=function(){
  byId("transactionFilter").value="";
  closeTransactionList();
  refreshFilters()
};
byId("clearFilters").onclick=function(){
  byId("transactionFilter").value="";
  closeTransactionList();
  if(statuses.length){byId("statusFilter").value=statuses[0].code}
  refreshFilters()
};
byId("prepaymentBody").onclick=function(e){
  var target=e.target||e.srcElement;
  var row=target;
  var id;
  while(row&&row.tagName&&row.tagName.toLowerCase()!=="tr"){row=row.parentNode}
  if(!row){return}
  id=row.getAttribute("data-id");
  if(!id){return}
  state.selectedId=id;
  renderTable()
};
byId("paginationBar").onclick=function(e){
  var target=e.target||e.srcElement;
  var page=target.getAttribute("data-page");
  var rows,pages;
  if(!page||target.disabled){return}
  rows=getFilteredRows();
  pages=Math.max(1,Math.ceil(rows.length/state.pageSize));
  if(page==="prev"){state.page=Math.max(1,state.page-1)}
  else if(page==="next"){state.page=Math.min(pages,state.page+1)}
  else{state.page=parseInt(page,10)||1}
  clearSelection();
  renderTable()
};
byId("settleBtn").onclick=openSettleModal;
byId("settleClose").onclick=closeSettleModal;
byId("settleNo").onclick=closeSettleModal;
byId("settleYes").onclick=settleSelected;
byId("calendarBtn").onclick=function(){
  if(byId("calendarPopup").className.indexOf("open")>=0){closeCalendar()}
  else{openCalendar()}
};
byId("calendarPopup").onclick=function(e){
  var target=e.target||e.srcElement;
  var nav=target.getAttribute("data-cal");
  var date=target.getAttribute("data-date");
  var year=target.getAttribute("data-year");
  var month=target.getAttribute("data-month");
  if(nav==="prev"){
    state.calendarDate.setMonth(state.calendarDate.getMonth()-1);
    state.calendarYear=state.calendarDate.getFullYear();
    renderCalendar();
    return
  }
  if(nav==="next"){
    state.calendarDate.setMonth(state.calendarDate.getMonth()+1);
    state.calendarYear=state.calendarDate.getFullYear();
    renderCalendar();
    return
  }
  if(nav==="title"){
    state.calendarMode=state.calendarMode==="days"?"years":"days";
    state.calendarYear=state.calendarDate.getFullYear();
    renderCalendar();
    return
  }
  if(nav==="clear"){
    byId("keyDate").value="";
    closeCalendar();
    loadResults();
    return
  }
  if(nav==="today"){
    var today=new Date();
    byId("keyDate").value=formatDate(today);
    state.calendarDate=today;
    state.calendarYear=today.getFullYear();
    closeCalendar();
    loadResults();
    return
  }
  if(year!==null&&year!==""){
    state.calendarYear=Number(year);
    state.calendarDate.setFullYear(state.calendarYear);
    state.calendarMode="years";
    renderCalendar();
    return
  }
  if(month!==null&&month!==""){
    state.calendarDate=new Date(state.calendarYear,Number(month),1);
    state.calendarMode="days";
    renderCalendar();
    return
  }
  if(date){
    byId("keyDate").value=date;
    state.calendarDate=parseDate(date);
    state.calendarYear=state.calendarDate.getFullYear();
    closeCalendar();
    loadResults()
  }
};
document.onkeydown=function(e){
  var event=e||window.event;
  if(event.keyCode===27){
    closeSettleModal();
    closeCalendar();
    closeTransactionList()
  }
  return true
};
renderCalendar();
})();
</script>
</body>
</html>
