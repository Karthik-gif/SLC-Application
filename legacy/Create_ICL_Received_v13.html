function byId(id){return document.getElementById(id)}
function esc(value){
var text=String(value==null?"":value);
text=text.replace(/&/g,"&amp;");
text=text.replace(/</g,"&lt;");
text=text.replace(/>/g,"&gt;");
return text.replace(/"/g,"&quot;")
}
function pad2(value){return ("0"+value).slice(-2)}
function parseDate(text){
var match=String(text||"").match(/^(\d{2})[-.](\d{2})[-.](\d{2}|\d{4})$/);
var year;
var date;
if(!match){return null}
year=Number(match[3]);
if(year<100){year+=2000}
date=new Date(year,Number(match[2])-1,Number(match[1]));
if(date.getFullYear()!==year||date.getMonth()!==Number(match[2])-1||date.getDate()!==Number(match[1])){return null}
return date
}
function formatDate(date){return pad2(date.getDate())+"-"+pad2(date.getMonth()+1)+"-"+date.getFullYear()}
function normalizeDate(id){var input=byId(id);var date=parseDate(input.value);if(date){input.value=formatDate(date)}return date}
function money(value){
var n=Number(value||0);
var parts=n.toFixed(2).split(".");
parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,",");
return parts.join(".")
}
function setStatus(text){byId("statusText").innerHTML=esc(text)}
function toast(message,kind){
var region=byId("toastRegion");
var box=document.createElement("div");
var icon=document.createElement("div");
var body=document.createElement("div");
var title=kind==="success"?"Success":kind==="warning"?"Warning":"Information";
box.className="toast "+(kind||"");
icon.className="toast-icon";
icon.innerHTML=kind==="success"?"OK":"i";
body.innerHTML='<div class="toast-title">'+title+'</div><div class="toast-message">'+esc(message)+'</div>';
box.appendChild(icon);
box.appendChild(body);
region.appendChild(box);
window.setTimeout(function(){if(box.parentNode){box.parentNode.removeChild(box)}},4200)
}
function statusHtml(status){
if(status==="RECEIVED"){return '<span class="status-text status-received" title="ICL Received">Received</span>'}
if(status==="REJECTED"){return '<span class="status-text status-rejected" title="Rejected">Rejected</span>'}
return '<span class="status-text status-pending" title="Pending">Pending</span>'
}
function valueText(row,column){
var value=row[column.key];
var date;
if(column.type==="amount"){return money(value)}
if(column.type==="rate"&&value!==""&&value!=null){return Number(value).toFixed(4)}
if(column.type==="date"){date=parseDate(value);return date?formatDate(date):String(value==null?"":value)}
return String(value==null?"":value)
}
function getFilteredRows(){
var upTo=parseDate(byId("uptoRequestDate").value);
var givenTxn=String(byId("givenTxnFilter").value||"").toLowerCase();
var requestNo=String(byId("requestFilter").value||"").toLowerCase();
var entity=String(byId("entityFilter").value||"").toLowerCase();
var ottk=String(byId("ottkFilter").value||"").toLowerCase();
var planned=String(byId("plannedDateFilter").value||"");
var rows=[];
var i;
var row;
var requestDate;
if(!upTo){return rows}
for(i=0;i<DATA.rows.length;i++){
row=DATA.rows[i];
requestDate=parseDate(row.requestDate);
if(!requestDate||requestDate>upTo){continue}
if(givenTxn&&String(row.iclGivenTxn||"").toLowerCase().indexOf(givenTxn)<0){continue}
if(requestNo&&String(row.iclRequestNo||"").toLowerCase().indexOf(requestNo)<0){continue}
if(entity&&String(row.entityId||"").toLowerCase().indexOf(entity)<0){continue}
if(ottk&&String(row.ottkNo||"").toLowerCase().indexOf(ottk)<0){continue}
if(planned){
var plannedInput=parseDate(planned);
var plannedRow=parseDate(row.plannedEndDate);
if(!plannedInput||!plannedRow||plannedInput.getTime()!==plannedRow.getTime()){continue}
}
rows.push({row:row,index:i})
}
return rows
}
function sortValue(item,column){
var value=item.row[column.key];
var date;
if(column.type==="amount"||column.type==="rate"){return Number(value||0)}
if(column.type==="date"){date=parseDate(value);return date?date.getTime():0}
return String(value||"").toLowerCase()
}
function applySort(rows){
var index=state.sort.index;
var direction=state.sort.direction;
var column;
if(index<0||!direction||!DATA.columns[index]){return rows}
column=DATA.columns[index];
rows.sort(function(a,b){
var av=sortValue(a,column);
var bv=sortValue(b,column);
if(av<bv){return direction==="asc"?-1:1}
if(av>bv){return direction==="asc"?1:-1}
return 0
});
return rows
}
function renderHeader(){
var html='<tr><th class="select-cell" style="min-width:64px;cursor:default">Select</th>';
var i;
var column;
var cls;
for(i=0;i<DATA.columns.length;i++){
column=DATA.columns[i];
cls=state.sort.index===i?(state.sort.direction==="asc"?"sort-asc":"sort-desc"):"";
html+='<th class="'+cls+'" data-sort="'+i+'" style="min-width:'+column.width+'px">'+esc(column.label);
html+='<span class="sort-arrows"><span class="sort-up"></span><span class="sort-down"></span></span></th>'
}
html+="</tr>";
byId("requestHead").innerHTML=html;
var totalWidth=0;
for(i=0;i<DATA.columns.length;i++){totalWidth+=Number(DATA.columns[i].width)||100}
totalWidth+=64;
byId("requestTable").style.minWidth=totalWidth+"px"
}
function renderPagination(totalRows){
var bar=byId("paginationBar");
var pages=Math.max(1,Math.ceil(totalRows/state.pageSize));
var html="";
var start;
var end;
var p;
if(state.page>pages){state.page=pages}
html+='<button class="page-btn" data-page="prev" type="button"'+(state.page===1?' disabled="disabled"':'')+'>Previous</button>';
start=Math.max(1,state.page-1);
end=Math.min(pages,start+2);
start=Math.max(1,end-2);
for(p=start;p<=end;p++){
html+='<button class="page-btn'+(p===state.page?' active':'')+'" data-page="'+p+'" type="button">'+p+'</button>'
}
html+='<button class="page-btn" data-page="next" type="button"'+(state.page===pages?' disabled="disabled"':'')+'>Next</button>';
bar.innerHTML=html
}
function renderTable(){
var rows=applySort(getFilteredRows());
var start=(state.page-1)*state.pageSize;
var end=Math.min(start+state.pageSize,rows.length);
var pageRows=rows.slice(start,end);
var html="";
var i;
var j;
var item;
var row;
var column;
var cls;
state.activeRows=rows;
renderHeader();
for(i=0;i<pageRows.length;i++){
item=pageRows[i];
row=item.row;
cls=item.index===state.selectedIndex?"selected":"";
html+='<tr class="'+cls+'" data-index="'+item.index+'">';
html+='<td class="select-cell"><input class="row-radio" type="radio" name="iclRowSelect"';
html+=(item.index===state.selectedIndex?' checked="checked"':'')+'></td>';
for(j=0;j<DATA.columns.length;j++){
column=DATA.columns[j];
if(column.type==="status"){html+='<td class="status-cell">'+statusHtml(row.statusCode)+'</td>'}
else if(column.type==="amount"||column.type==="rate"){html+='<td class="number">'+esc(valueText(row,column))+'</td>'}
else{html+='<td>'+esc(valueText(row,column))+'</td>'}
}
html+="</tr>"
}
if(!html){
html='<tr><td class="empty" colspan="'+(DATA.columns.length+1)+'">No ICL requests match the current selection.</td></tr>'
}
byId("requestBody").innerHTML=html;
byId("recordCount").innerHTML=rows.length+" request"+(rows.length===1?"":"s")+" found";
renderPagination(rows.length);
updateActions()
}
function updateActions(){
var row=state.selectedIndex>=0?DATA.rows[state.selectedIndex]:null;
byId("selectionCount").innerHTML=row?"ICL Request "+esc(row.iclRequestNo)+" selected":"No row selected";
byId("createReceivedBtn").disabled=!row||row.statusCode==="RECEIVED";
byId("dmsBtn").disabled=!row
}
function refreshFromInputs(){
var raw=byId("uptoRequestDate").value;
var date=parseDate(raw);
state.page=1;
state.selectedIndex=-1;
if(!raw){byId("resultsArea").className="results";setStatus("Enter an Upto Request Date to load ICL requests");return}
if(!date){
byId("resultsArea").className="results";
toast("Enter the date in DD-MM-YYYY format.","warning");
setStatus("Invalid Upto Request Date");
return
}
byId("uptoRequestDate").value=formatDate(date);
normalizeDate("plannedDateFilter");
byId("resultsArea").className="results open";
renderTable();
setStatus("ICL requests loaded")
}
function refreshFilters(){
if(!parseDate(byId("uptoRequestDate").value)){return}
state.page=1;
state.selectedIndex=-1;
normalizeDate("plannedDateFilter");
renderTable()
}
function clearFilters(){
byId("givenTxnFilter").value="";
byId("requestFilter").value="";
byId("entityFilter").value="";
byId("ottkFilter").value="";
byId("plannedDateFilter").value="";
refreshFilters()
}
function comboValues(key,query){
var seen={};
var values=[];
var q=String(query||"").toLowerCase();
var i;
var value;
for(i=0;i<DATA.rows.length;i++){
value=String(DATA.rows[i][key]||"");
if(!value||seen[value]){continue}
if(q&&value.toLowerCase().indexOf(q)<0){continue}
seen[value]=true;
values.push(value)
}
values.sort();
return values
}
function closeCombo(){
if(activeCombo&&comboConfig[activeCombo]){byId(comboConfig[activeCombo].list).className="combo-list"}
activeCombo=""
}
function renderCombo(inputId){
var cfg=comboConfig[inputId];
var list;
var values;
var html="";
var i;
if(!cfg){return}
if(activeCombo&&activeCombo!==inputId){closeCombo()}
activeCombo=inputId;
list=byId(cfg.list);
values=comboValues(cfg.key,byId(inputId).value);
for(i=0;i<values.length;i++){
html+='<button class="combo-option" data-combo-value="'+esc(values[i])+'" type="button">'+esc(values[i])+"</button>"
}
if(!html){html='<div class="combo-empty">No matching values</div>'}
list.innerHTML=html;
list.className="combo-list open"
}
function chooseCombo(inputId,value){
byId(inputId).value=value;
closeCombo();
refreshFilters()
}
function bindCombo(inputId){
var cfg=comboConfig[inputId];
var input=byId(inputId);
var list=byId(cfg.list);
var buttons=document.querySelectorAll('[data-combo="'+inputId+'"]');
var i;
input.oninput=function(){refreshFilters();renderCombo(inputId)};
input.onfocus=function(){renderCombo(inputId)};
for(i=0;i<buttons.length;i++){
buttons[i].onclick=function(e){
if(e&&e.stopPropagation){e.stopPropagation()}
if(activeCombo===inputId){closeCombo()}else{renderCombo(inputId)}
}
}
list.onclick=function(e){
var target=e.target||e.srcElement;
var value=target.getAttribute&&target.getAttribute("data-combo-value");
if(value!==null&&value!==undefined){chooseCombo(inputId,value)}
}
}
function createReceived(){
var row=state.selectedIndex>=0?DATA.rows[state.selectedIndex]:null;
var txn;
if(!row){toast("Select one ICL request first.","warning");return}
if(row.statusCode==="RECEIVED"){toast("ICL Received transaction already exists for this request.","warning");return}
txn=String(Number(DATA.settings.nextReceivedTransaction)||2602001942);
DATA.settings.nextReceivedTransaction=Number(txn)+1;
row.statusCode="RECEIVED";
row.iclRecCompanyCode=row.targetReceivedCompanyCode||"";
row.iclRecTxn=txn;
row.activeActivity="Received";
if(row.dms&&row.dms.uploaded){row.dms.finalized=true}
renderTable();
toast("ICL Received Transaction "+txn+" created successfully.","success");
setStatus("ICL Received Transaction "+txn+" created successfully")
}
function dmsRow(){return activeDmsIndex>=0?DATA.rows[activeDmsIndex]:null}
function dmsDoc(){var row=dmsRow();return row?row.dms:null}
function dmsFilePath(doc){
if(!doc){return "Select file"}
if(doc.filePath){return doc.filePath}
if(doc.fileName){return doc.fileName}
return "Select file"
}
function renderDms(){
var row=dmsRow();
var doc=dmsDoc();
var locked;
var pathClass;
var docDate;
var html="";
if(!row||!doc){return}
locked=row.statusCode==="RECEIVED";
pathClass=locked||doc.finalized?"path-cell disabled":"path-cell";
docDate=parseDate(doc.docDate);
byId("dmsTransaction").innerHTML=esc(row.iclRecTxn||row.iclGivenTxn||"");
html+="<tr>";
html+="<td>"+esc(doc.docType)+"</td>";
html+="<td>"+esc(doc.docTypeDesc)+"</td>";
html+="<td>"+esc(docDate?formatDate(docDate):doc.docDate)+"</td>";
html+='<td><div id="filePathCell" class="'+pathClass+'" title="'+esc(dmsFilePath(doc))+'"><span>'+esc(dmsFilePath(doc))+"</span></div></td>";
html+="<td>"+esc(doc.dmsCode)+"</td>";
html+='<td><button id="uploadBtn" class="action-btn" type="button">Upload</button></td>';
html+='<td><button id="downloadBtn" class="action-btn" type="button">Download</button></td>';
html+='<td><button id="editBtn" class="action-btn" type="button">Edit</button></td>';
html+="</tr>";
byId("dmsBody").innerHTML=html;
byId("uploadBtn").disabled=locked||doc.finalized||doc.uploaded||!pendingFile;
byId("downloadBtn").disabled=!doc.uploaded;
byId("editBtn").disabled=locked||doc.finalized||!doc.uploaded;
byId("dmsConfirm").disabled=locked||doc.finalized||!doc.uploaded;
byId("filePathCell").onclick=function(){
if(!locked&&!doc.finalized){editMode=false;byId("dmsFileInput").click()}
};
byId("uploadBtn").onclick=uploadDms;
byId("downloadBtn").onclick=downloadDms;
byId("editBtn").onclick=function(){
if(!locked&&!doc.finalized&&doc.uploaded){editMode=true;byId("dmsFileInput").click()}
}
}
function openDms(){
var row=state.selectedIndex>=0?DATA.rows[state.selectedIndex]:null;
if(!row){toast("Select one ICL request first.","warning");return}
activeDmsIndex=state.selectedIndex;
pendingFile=null;
editMode=false;
if(!row.dms.docDate){row.dms.docDate=formatDate(new Date())}
renderDms();
byId("dmsModal").className="modal-bg open"
}
function closeDms(){byId("dmsModal").className="modal-bg";pendingFile=null;editMode=false;byId("dmsFileInput").value=""}
function fileSelected(){
var input=byId("dmsFileInput");
var doc=dmsDoc();
var file=input.files&&input.files.length?input.files[0]:null;
if(!doc||!file){return}
pendingFile=file;
doc.fileName=file.name||"Selected file";
doc.filePath=input.value||doc.fileName;
if(editMode){doc.uploaded=false}
renderDms()
}
function uploadDms(){
var doc=dmsDoc();
if(!doc||doc.finalized){return}
if(!pendingFile){toast("Select a file from File Path first.","warning");return}
doc.fileObject=pendingFile;
doc.uploaded=true;
if(!doc.dmsCode){doc.dmsCode=String(Number(DATA.settings.nextDmsCode)||6010000539);DATA.settings.nextDmsCode=Number(doc.dmsCode)+1}
pendingFile=null;
editMode=false;
renderDms();
toast("Document uploaded. DMS Code "+doc.dmsCode+" generated.","success")
}
function downloadDms(){
var doc=dmsDoc();
var file;
var url;
var link;
if(!doc||!doc.uploaded){return}
file=doc.fileObject;
if(file&&window.navigator&&window.navigator.msSaveOrOpenBlob){window.navigator.msSaveOrOpenBlob(file,doc.fileName||"ICL_Document");return}
if(file&&window.URL&&window.URL.createObjectURL){
url=window.URL.createObjectURL(file);
link=document.createElement("a");
link.href=url;
link.download=doc.fileName||"ICL_Document";
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
window.setTimeout(function(){window.URL.revokeObjectURL(url)},1000);
return
}
toast("The uploaded document is available from SAP DMS in the integrated screen.","warning")
}
function confirmDms(){
var doc=dmsDoc();
if(!doc||doc.finalized){return}
if(!doc.uploaded){toast("Upload the document before confirming.","warning");return}
doc.finalized=true;
renderDms();
toast("Document Uploaded Successfully. Doc No: "+doc.dmsCode,"success");
setStatus("Document Uploaded Successfully. Doc No: "+doc.dmsCode)
}
var CAL_MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
var CAL_DAYS=["Su","Mo","Tu","We","Th","Fr","Sa"];
function sameDate(a,b){return !!a&&!!b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function calendarIso(date){return date.getFullYear()+"-"+pad2(date.getMonth()+1)+"-"+pad2(date.getDate())}
function calendarFromIso(text){
var m=String(text||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);
if(!m){return null}
return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]))
}
function calendarHeader(c){
var html='<div class="calendar-top"><button class="calendar-title-btn" data-cal-action="picker" type="button">';
html+=esc(CAL_MONTHS[c.month]+" "+c.year)+"</button><div class=\"calendar-navs\">";
html+='<button class="calendar-nav prev" data-cal-action="prev" type="button"></button>';
html+='<button class="calendar-nav next" data-cal-action="next" type="button"></button></div></div>';
return html
}
function calendarDayView(c){
var selected=parseDate(byId(c.targetId).value);
var today=new Date();
var first=new Date(c.year,c.month,1);
var start=new Date(c.year,c.month,1-first.getDay());
var html=calendarHeader(c);
var i;
var d;
var cls;
html+='<div class="calendar-week">';
for(i=0;i<CAL_DAYS.length;i++){html+="<span>"+CAL_DAYS[i]+"</span>"}
html+='</div><div class="calendar-days">';
for(i=0;i<42;i++){
d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
cls="calendar-cell";
if(d.getMonth()!==c.month){cls+=" other"}
if(sameDate(d,selected)){cls+=" selected"}
html+='<button class="'+cls+'" data-cal-action="day" data-date="'+calendarIso(d)+'" type="button">'+d.getDate()+"</button>"
}
html+='</div><div class="calendar-foot">';
html+='<button class="calendar-foot-btn" data-cal-action="clear" type="button">Clear</button>';
html+='<button class="calendar-foot-btn" data-cal-action="today" type="button">Today</button></div>';
return html
}
function calendarPickerView(c){
var html=calendarHeader(c);
var i;
var startYear=c.year-6;
var endYear=c.year+10;
html+='<div class="calendar-picker"><div class="month-grid">';
for(i=0;i<12;i++){
html+='<button class="month-btn'+(i===c.month?' selected':'')+'" data-cal-action="month" data-month="'+i+'" type="button">';
html+=CAL_MONTHS[i].substr(0,3)+"</button>"
}
html+='</div><div class="year-list">';
for(i=startYear;i<=endYear;i++){
html+='<button class="year-btn'+(i===c.year?' selected':'')+'" data-cal-action="year" data-year="'+i+'" type="button">'+i+"</button>"
}
html+="</div></div>";
return html
}
function renderCalendar(){
var c=state.calendar;
var popup;
if(!c){return}
popup=byId(c.popupId);
popup.innerHTML=c.view==="picker"?calendarPickerView(c):calendarDayView(c);
popup.className="calendar-popup open";
popup.onclick=calendarClick
}
function calendarApply(targetId){if(targetId==="uptoRequestDate"){refreshFromInputs()}else{normalizeDate(targetId);refreshFilters()}}
function calendarClick(e){
var target=e.target||e.srcElement;
var action=target.getAttribute&&target.getAttribute("data-cal-action");
var c=state.calendar;
var date;
if(!c||!action){return}
e.stopPropagation();
if(action==="picker"){c.view=c.view==="picker"?"days":"picker";renderCalendar();return}
if(action==="prev"||action==="next"){
date=new Date(c.year,c.month+(action==="prev"?-1:1),1);
c.month=date.getMonth();c.year=date.getFullYear();c.view="days";renderCalendar();return
}
if(action==="month"){c.month=parseInt(target.getAttribute("data-month"),10)||0;renderCalendar();return}
if(action==="year"){c.year=parseInt(target.getAttribute("data-year"),10)||c.year;c.view="days";renderCalendar();return}
if(action==="day"){
date=calendarFromIso(target.getAttribute("data-date"));
if(!date){return}
byId(c.targetId).value=formatDate(date);byId(c.popupId).className="calendar-popup";state.calendar=null;calendarApply(c.targetId);return
}
if(action==="clear"){
byId(c.targetId).value="";byId(c.popupId).className="calendar-popup";state.calendar=null;calendarApply(c.targetId);return
}
if(action==="today"){
byId(c.targetId).value=formatDate(new Date());byId(c.popupId).className="calendar-popup";state.calendar=null;calendarApply(c.targetId)
}
}
function toggleCalendar(buttonId,targetId,popupId,e){
var current=parseDate(byId(targetId).value)||new Date();
e.stopPropagation();
if(state.calendar&&state.calendar.popupId===popupId){byId(popupId).className="calendar-popup";state.calendar=null;return}
if(state.calendar){byId(state.calendar.popupId).className="calendar-popup"}
state.calendar={buttonId:buttonId,targetId:targetId,popupId:popupId,month:current.getMonth(),year:current.getFullYear(),view:"days"};
renderCalendar()
}
byId("uptoCalendarBtn").onclick=function(e){toggleCalendar("uptoCalendarBtn","uptoRequestDate","uptoCalendar",e)};
byId("plannedCalendarBtn").onclick=function(e){toggleCalendar("plannedCalendarBtn","plannedDateFilter","plannedCalendar",e)};
byId("filterToggle").onclick=function(){var body=byId("filterBody");body.className=body.className.indexOf("open")>=0?"filter-body":"filter-body open"};
byId("uptoRequestDate").onchange=refreshFromInputs;
bindCombo("givenTxnFilter");
bindCombo("requestFilter");
bindCombo("entityFilter");
bindCombo("ottkFilter");
byId("plannedDateFilter").onchange=refreshFilters;
byId("clearFilters").onclick=clearFilters;
byId("requestHead").onclick=function(e){
var target=e.target||e.srcElement;
var th=target;
var index;
while(th&&th.tagName&&th.tagName.toLowerCase()!=="th"){th=th.parentNode}
if(!th||th.getAttribute("data-sort")===null){return}
index=parseInt(th.getAttribute("data-sort"),10);
if(isNaN(index)){return}
if(state.sort.index===index){state.sort.direction=state.sort.direction==="asc"?"desc":"asc"}
else{state.sort.index=index;state.sort.direction="asc"}
state.page=1;renderTable()
};
byId("requestBody").onclick=function(e){
var target=e.target||e.srcElement;
var tr=target;
var index;
while(tr&&tr.tagName&&tr.tagName.toLowerCase()!=="tr"){tr=tr.parentNode}
if(!tr||tr.getAttribute("data-index")===null){return}
index=parseInt(tr.getAttribute("data-index"),10);
if(isNaN(index)){return}
state.selectedIndex=index;renderTable()
};
byId("paginationBar").onclick=function(e){
var target=e.target||e.srcElement;
var page=target.getAttribute&&target.getAttribute("data-page");
var pages=Math.max(1,Math.ceil(state.activeRows.length/state.pageSize));
if(!page||target.disabled){return}
if(page==="prev"){state.page=Math.max(1,state.page-1)}
else if(page==="next"){state.page=Math.min(pages,state.page+1)}
else{state.page=parseInt(page,10)||1}
renderTable()
};
byId("createReceivedBtn").onclick=createReceived;
byId("dmsBtn").onclick=openDms;
byId("dmsClose").onclick=closeDms;
byId("dmsCancel").onclick=closeDms;
byId("dmsConfirm").onclick=confirmDms;
byId("dmsFileInput").onchange=fileSelected;
document.onclick=function(e){
var target=e.target||e.srcElement;
var popup;
var btn;
var shell=target;
if(state.calendar){
popup=byId(state.calendar.popupId);
btn=byId(state.calendar.buttonId);
if(target!==btn&&!popup.contains(target)){popup.className="calendar-popup";state.calendar=null}
}
if(activeCombo){
while(shell&&shell.className&&String(shell.className).indexOf("combo-shell")<0){shell=shell.parentNode}
if(!shell){closeCombo()}
}
};
document.onkeydown=function(e){
var event=e||window.event;
if(event.keyCode===27){closeDms();byId("uptoCalendar").className="calendar-popup";byId("plannedCalendar").className="calendar-popup";state.calendar=null}
return true
};
})();
</script>
