    "K": 1000,
    "L": 100000,
    "M": 1000000,
    "CR": 10000000,
    "B": 1000000000
  }
}
</script>

<script type="text/javascript">
(function(){
var MODEL=JSON.parse(document.getElementById("sblcPayload").innerHTML);
var DATA=MODEL.records;
var columns=MODEL.columns;
var requestColumns=MODEL.requestColumns;
var state={
  page:1,pageSize:15,selectedId:null,sortIndex:-1,sortDirection:"asc",activeRecordId:null,
  requestDrafts:[],requestDraftSeq:1,calendarRowId:"",calendarField:"",calendarDate:new Date(),
  calendarMode:"days",calendarYear:new Date().getFullYear()
};
function byId(id){return document.getElementById(id)}
function esc(value){
  var text=String(value==null?"":value);
  text=text.replace(/&/g,"&amp;");
  text=text.replace(/</g,"&lt;");
  text=text.replace(/>/g,"&gt;");
  return text.replace(/"/g,"&quot;")
}
function money(value){
  if(value===""||value===null||typeof value==="undefined"){return ""}
  var number=Number(value||0);
  var parts=number.toFixed(2).split(".");
  parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return parts.join(".")
}
function setStatus(text){byId("statusText").innerHTML=esc(text)}
function toast(message,title,iconText){
  var region=byId("toastRegion");
  var box=document.createElement("div");
  var icon=document.createElement("div");
  var body=document.createElement("div");
  box.className="toast";
  icon.className="toast-icon";
  icon.innerHTML=esc(iconText||"OK");
  body.innerHTML='<div class="toast-title">'+esc(title||"Success")+'</div>';
  body.innerHTML+='<div class="toast-message">'+esc(message)+"</div>";
  box.appendChild(icon);
  box.appendChild(body);
  region.appendChild(box);
  window.setTimeout(function(){
    if(box.parentNode){box.parentNode.removeChild(box)}
  },4200)
}
function uniqueValues(key,filterFn){
  var seen={};
  var list=[];
  var i,row,value;
  for(i=0;i<DATA.length;i++){
    row=DATA[i];
    if(filterFn&&!filterFn(row)){continue}
    value=String(row[key]||"");
    if(value&&!seen[value]){
      seen[value]=true;
      list.push(value)
    }
  }
  list.sort();
  return list
}
function renderStructureOptions(){
  var list=uniqueValues("tsfStructure");
  var html='<option value="">Select TSF Structure</option>';
  var i;
  for(i=0;i<list.length;i++){
    html+='<option value="'+esc(list[i])+'">'+esc(list[i])+"</option>"
  }
  byId("tsfStructure").innerHTML=html
}
function readyToLoad(){
  return byId("tsfStructure").value!==""
}
function ensureDisplayValues(){
  var config=MODEL.sblcTransaction||{};
  var start=Number(config.start||0);
  var step=Number(config.step||1);
  var i,row;
  for(i=0;i<DATA.length;i++){
    row=DATA[i];
    if(!row.sblcTxn&&start){row.sblcTxn=String(start+(Number(row.id)-1)*step)}
    if(row.sblcAmt===""||row.sblcAmt===null){row.sblcAmt=row.proposedSblcAmt}
  }
}
function getFilteredRows(){
  var structure=byId("tsfStructure").value;
  var ottk=byId("ottkFilter").value.toLowerCase();
  var entity=byId("entityFilter").value.toLowerCase();
  var deal=byId("dealFilter").value.toLowerCase();
  var status=byId("statusFilter").value.toLowerCase();
  var rows=[];
  var i,row;
  for(i=0;i<DATA.length;i++){
    row=DATA[i];
    if(structure&&row.tsfStructure!==structure){continue}
    if(ottk&&String(row.ottkNo).toLowerCase().indexOf(ottk)<0){continue}
    if(entity&&String(row.entityId).toLowerCase().indexOf(entity)<0){continue}
    if(deal&&String(row.dealId).toLowerCase().indexOf(deal)<0){continue}
    if(status&&String(row.ottkStatDesc).toLowerCase().indexOf(status)<0){continue}
    rows.push(row)
  }
  if(state.sortIndex>=0){sortRows(rows,state.sortIndex,state.sortDirection)}
  return rows
}
function sortRows(rows,index,direction){
  var column=columns[index];
  rows.sort(function(a,b){
    var av=a[column.key];
    var bv=b[column.key];
    if(column.type==="number"){
      av=Number(av||0);
      bv=Number(bv||0)
    }else{
      av=String(av||"").toLowerCase();
      bv=String(bv||"").toLowerCase()
    }
    if(av<bv){return direction==="asc"?-1:1}
    if(av>bv){return direction==="asc"?1:-1}
    return 0
  })
}
function headerHtml(){
  var html='<tr><th style="width:64px">Select</th>';
  var i,column,cls;
  for(i=0;i<columns.length;i++){
    column=columns[i];
    cls="";
    if(state.sortIndex===i){cls=state.sortDirection==="asc"?"sort-asc":"sort-desc"}
    html+='<th class="'+cls+'" data-index="'+i+'" style="width:'+column.width+'px">';
    html+=esc(column.label);
    html+='<span class="sort-arrows"><span class="sort-up"></span><span class="sort-down"></span></span>';
    html+="</th>"
  }
  return html+"</tr>"
}
function renderTable(){
  var rows=getFilteredRows();
  var start=(state.page-1)*state.pageSize;
  var pages=Math.max(1,Math.ceil(rows.length/state.pageSize));
  var end,i,j,row,column,html="",pageRows,value,cls;
  if(state.page>pages){state.page=pages;start=(state.page-1)*state.pageSize}
  end=Math.min(start+state.pageSize,rows.length);
  pageRows=rows.slice(start,end);
  byId("mainHead").innerHTML=headerHtml();
  for(i=0;i<pageRows.length;i++){
    row=pageRows[i];
    cls=String(row.id)===String(state.selectedId)?"selected":"";
    html+='<tr data-id="'+row.id+'" class="'+cls+'">';
    html+='<td class="select-cell"><input type="radio" name="sblcPick" value="'+row.id+'"';
    if(String(row.id)===String(state.selectedId)){html+=' checked="checked"'}
    html+='></td>';
    for(j=0;j<columns.length;j++){
      column=columns[j];
      value=row[column.key];
      html+='<td class="'+(column.type==="number"?"number":"")+'">';
      html+=column.type==="number"?esc(money(value)):esc(value);
      html+="</td>"
    }
    html+="</tr>"
  }
  if(!html){
    html='<tr><td colspan="'+(columns.length+1)+'" class="empty">';
    html+="No SBLC request records match the current selection.</td></tr>"
  }
  byId("mainBody").innerHTML=html;
  byId("recordCount").innerHTML=rows.length+" record"+(rows.length===1?"":"s");
  renderPagination(rows.length);
  updateActionState();
  bindHeaderSort()
}
function renderPagination(total){
  var bar=byId("paginationBar");
  var pages=Math.max(1,Math.ceil(total/state.pageSize));
  var html='<button class="page-btn" data-page="prev" type="button"';
  var p,startPage,endPage;
  html+=state.page===1?' disabled="disabled"':'';
  html+='>&lt;</button>';
  startPage=Math.max(1,state.page-1);
  endPage=Math.min(pages,startPage+2);
  startPage=Math.max(1,endPage-2);
  for(p=startPage;p<=endPage;p++){
    html+='<button class="page-btn'+(p===state.page?' active':'')+'" data-page="'+p+'" type="button">'+p+"</button>"
  }
  html+='<button class="page-btn" data-page="next" type="button"';
  html+=state.page===pages?' disabled="disabled"':'';
  html+='>&gt;</button>';
  bar.innerHTML=html
}
function findRowById(id){
  var i;
  for(i=0;i<DATA.length;i++){
    if(String(DATA[i].id)===String(id)){return DATA[i]}
  }
  return null
}
function selectedRow(){return findRowById(state.selectedId)}
function clearSelection(){
  state.selectedId=null;
  byId("createRequestBtn").disabled=true;
  byId("selectionMeta").innerHTML="Select one line item"
}
function recordHasRequest(row){
  return !!(row&&row.requestNo)
}
function updateActionState(){
  var row=selectedRow();
  if(!row){
    byId("createRequestBtn").disabled=true;
    byId("selectionMeta").innerHTML="Select one line item";
    return
  }
  byId("createRequestBtn").disabled=false;
  byId("selectionMeta").innerHTML=recordHasRequest(row)?"Request already created":"1 line item selected"
}
function loadResults(){
  if(!readyToLoad()){
    byId("resultsArea").className="";
    clearSelection();
    setStatus("Select TSF Structure");
    return
  }
  state.page=1;
  clearSelection();
  byId("resultsArea").className="open";
  renderTable();
  setStatus("SBLC request records loaded")
}
function refreshFilters(){
  if(!readyToLoad()){loadResults();return}
  state.page=1;
  clearSelection();
  renderTable()
}
function bindHeaderSort(){
  var headers=byId("mainHead").getElementsByTagName("th");
  var i;
  for(i=0;i<headers.length;i++){
    headers[i].onclick=function(){
      var index=parseInt(this.getAttribute("data-index"),10);
      if(isNaN(index)){return}
      if(state.sortIndex===index){
        state.sortDirection=state.sortDirection==="asc"?"desc":"asc"
      }else{
        state.sortIndex=index;
        state.sortDirection="asc"
      }
      state.page=1;
      clearSelection();
      renderTable()
    }
  }
}
function buildComboList(inputId,listId,key){
  var list=byId(listId);
  var structure=byId("tsfStructure").value;
  var typed=byId(inputId).value.toLowerCase();
  var seen={};
  var html="";
  var i,row,value;
  for(i=0;i<DATA.length;i++){
    row=DATA[i];
    if(structure&&row.tsfStructure!==structure){continue}
    value=String(row[key]||"");
    if(typed&&value.toLowerCase().indexOf(typed)<0){continue}
    if(!value||seen[value]){continue}
    seen[value]=true;
    html+='<button class="combo-option" data-value="'+esc(value)+'" type="button">'+esc(value)+"</button>"
  }
  if(!html){html='<div class="combo-empty">No matching values</div>'}
  list.innerHTML=html
}
function openCombo(inputId,listId,key){
  buildComboList(inputId,listId,key);
  byId(listId).className="combo-list open"
}
function closeCombo(listId){byId(listId).className="combo-list"}
function closeAllCombos(){
  closeCombo("ottkList");
  closeCombo("entityList");
  closeCombo("dealList");
  closeCombo("statusList")
}
function requestHeaderHtml(){
  var html="<tr>";
  var i,column;
  for(i=0;i<requestColumns.length;i++){
    column=requestColumns[i];
    html+='<th style="width:'+column.width+'px">'+esc(column.label)+"</th>"
  }
  return html+"</tr>"
}
function renderBasicDetails(record){
  var html="";
  html+='<div class="basic-item"><div class="basic-label">OTTK No</div>';
  html+='<div class="basic-value">'+esc(record.ottkNo)+'</div></div>';
  html+='<div class="basic-item"><div class="basic-label">Company Code</div>';
  html+='<div class="basic-value">'+esc(record.companyCode)+'</div>';
  html+='<div class="basic-name">'+esc(record.companyName)+'</div></div>';
  html+='<div class="basic-item"><div class="basic-label">Business Area</div>';
  html+='<div class="basic-value">'+esc(record.businessArea)+'</div>';
  html+='<div class="basic-name">'+esc(record.businessAreaName)+'</div></div>';
  byId("basicDetails").innerHTML=html
}
function draftById(rowId){
  var i;
  for(i=0;i<state.requestDrafts.length;i++){
    if(String(state.requestDrafts[i].id)===String(rowId)){return state.requestDrafts[i]}
  }
  return null
}
function cloneRequestRow(row){
  return {
    id:row.id,startDate:row.startDate||"",endDate:row.endDate||"",expEndDate:row.expEndDate||"",
    amount:row.amount==null?"":row.amount,requestType:row.requestType||MODEL.requestTypes[0]||"",
    companyCode:row.companyCode||"",beneficiary:row.beneficiary||"",beneficiaryName:row.beneficiaryName||"",
    requestNo:row.requestNo||""
  }
}
function nextDraftId(){
  var id="N"+state.requestDraftSeq;
  state.requestDraftSeq+=1;
  return id
}
function newRequestDraft(record){
  var source=state.requestDrafts.length?state.requestDrafts[0]:record.requestRows[0]||{};
  return {
    id:nextDraftId(),startDate:"",endDate:"",expEndDate:"",amount:"",
    requestType:MODEL.requestTypes[0]||"SBLC Treasury",companyCode:"",
    beneficiary:source.beneficiary||"",beneficiaryName:source.beneficiaryName||"",requestNo:""
  }
}
function renderRequestTable(){
  var record=findRowById(state.activeRecordId);
  var html="";
  var i,j,row,column,value,options,k,disabled;
  if(!record){return}
  byId("requestHead").innerHTML=requestHeaderHtml();
  for(i=0;i<state.requestDrafts.length;i++){
    row=state.requestDrafts[i];
    disabled=!!row.requestNo;
    html+='<tr data-request-row="'+esc(row.id)+'">';
    for(j=0;j<requestColumns.length;j++){
      column=requestColumns[j];
      value=row[column.key];
      html+='<td class="'+(column.type==="number"?"number":"")+'">';
      if(column.type==="date"){
        html+=requestDateField(row.id,column.key,value,disabled)
      }else if(column.key==="amount"){
        html+=requestInput(row.id,column.key,value,"Enter amount",disabled,"request-amount")
      }else if(column.type==="number"){
        html+=esc(money(value))
      }else if(column.type==="requestType"){
        options="";
        for(k=0;k<MODEL.requestTypes.length;k++){
          options+='<option value="'+esc(MODEL.requestTypes[k])+'"';
          if(MODEL.requestTypes[k]===row.requestType){options+=' selected="selected"'}
          options+='>'+esc(MODEL.requestTypes[k])+"</option>"
        }
        html+='<select class="request-select" data-request-type="'+esc(row.id)+'"';
        if(disabled){html+=' disabled="disabled"'}
        html+='>'+options+"</select>"
      }else if(column.type==="action"){
        html+='<button class="btn inline-create" data-create-row="'+esc(row.id)+'" type="button"';
        if(disabled){html+=' disabled="disabled"'}
        html+='>Create</button>'
      }else if(column.key==="requestNo"){
        html+='<span class="request-no">'+esc(row.requestNo||"")+"</span>"
      }else if(column.key==="companyCode"){
        html+=requestInput(row.id,column.key,value,"Co.Code",disabled,"")
      }else{
        html+=esc(value)
      }
      html+="</td>"
    }
    html+="</tr>"
  }
  byId("requestBody").innerHTML=html;
  byId("requestMeta").innerHTML=state.requestDrafts.length+" request line";
  if(state.requestDrafts.length!==1){byId("requestMeta").innerHTML+="s"}
}
function requestInput(rowId,key,value,placeholder,disabled,extraClass){
  var cls="request-input"+(extraClass?" "+extraClass:"");
  var html='<input class="'+cls+'" data-row-id="'+esc(rowId)+'"';
  html+=' data-request-field="'+esc(key)+'" type="text" value="'+esc(value||"")+'"';
  html+=' placeholder="'+esc(placeholder)+'"';
  if(disabled){html+=' disabled="disabled"'}
  return html+">"
}
function requestDateField(rowId,key,value,disabled){
  var html='<div class="request-date-shell">';
  html+='<input class="request-input request-date-input" data-row-id="'+esc(rowId)+'"';
  html+=' data-request-field="'+esc(key)+'" type="text" value="'+esc(value||"")+'" placeholder="DD-MM-YYYY"';
  if(disabled){html+=' disabled="disabled"'}
  html+='>';
  html+='<button class="request-calendar-btn" data-row-id="'+esc(rowId)+'"';
  html+=' data-calendar-field="'+esc(key)+'" type="button"';
  if(disabled){html+=' disabled="disabled"'}
  html+='></button>';
  html+='<div class="request-calendar" data-row-id="'+esc(rowId)+'"';
  html+=' data-calendar-popup="'+esc(key)+'"></div></div>';
  return html
}
function parseDate(text){
  var match=String(text||"").match(/^(\d{2})-(\d{2})-(\d{4})$/);
  var date;
  if(!match){return null}
  date=new Date(Number(match[3]),Number(match[2])-1,Number(match[1]));
  if(date.getFullYear()!==Number(match[3])){return null}
  if(date.getMonth()!==Number(match[2])-1){return null}
  if(date.getDate()!==Number(match[1])){return null}
  return date
}
function formatDate(date){
  var day=("0"+date.getDate()).slice(-2);
  var month=("0"+(date.getMonth()+1)).slice(-2);
  return day+"-"+month+"-"+date.getFullYear()
}
function monthNames(){
  return ["January","February","March","April","May","June","July","August","September","October","November","December"]
}
function shortMonthNames(){
  return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]
}
function sameDate(a,b){
  return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()
}
function closeRequestCalendars(){
  var nodes=byId("requestBody").getElementsByClassName("request-calendar");
  var i;
  for(i=0;i<nodes.length;i++){nodes[i].className="request-calendar"}
  state.calendarRowId="";
  state.calendarField=""
}
function calendarPopup(rowId,field){
  var nodes=byId("requestBody").getElementsByClassName("request-calendar");
  var i;
  for(i=0;i<nodes.length;i++){
    if(nodes[i].getAttribute("data-row-id")!==String(rowId)){continue}
    if(nodes[i].getAttribute("data-calendar-popup")===field){return nodes[i]}
  }
  return null
}
function calendarButton(rowId,field){
  var nodes=byId("requestBody").getElementsByClassName("request-calendar-btn");
  var i;
  for(i=0;i<nodes.length;i++){
    if(nodes[i].getAttribute("data-row-id")!==String(rowId)){continue}
    if(nodes[i].getAttribute("data-calendar-field")===field){return nodes[i]}
  }
  return null
}
function placeRequestCalendar(){
  var popup=calendarPopup(state.calendarRowId,state.calendarField);
  var button=calendarButton(state.calendarRowId,state.calendarField);
  var rect,viewWidth,viewHeight,width,height,left,top;
  if(!popup||!button||popup.className.indexOf("open")<0){return}
  rect=button.getBoundingClientRect();
  viewWidth=document.documentElement.clientWidth||document.body.clientWidth;
  viewHeight=document.documentElement.clientHeight||document.body.clientHeight;
  width=popup.offsetWidth||274;
  height=popup.offsetHeight||360;
  left=rect.left;
  if(left+width>viewWidth-12){left=Math.max(12,viewWidth-width-12)}
  top=rect.bottom+4;
  if(top+height>viewHeight-12){top=Math.max(12,rect.top-height-4)}
  popup.style.left=Math.round(left)+"px";
  popup.style.top=Math.round(top)+"px"
}
function renderRequestCalendar(){
  var popup=calendarPopup(state.calendarRowId,state.calendarField);
  if(!popup){return}
  if(state.calendarMode==="years"){renderRequestYears(popup)}
  else{renderRequestDays(popup)}
  placeRequestCalendar()
}
function renderRequestDays(popup){
  var target=state.calendarDate;
  var year=target.getFullYear();
  var month=target.getMonth();
  var draft=draftById(state.calendarRowId);
  var selected=parseDate(draft?draft[state.calendarField]:"");
  var first=new Date(year,month,1);
  var firstCell=new Date(year,month,1-first.getDay());
  var names=monthNames();
  var week=["Su","Mo","Tu","We","Th","Fr","Sa"];
  var html='<div class="calendar-head">';
  var i,cell,cls;
  html+='<button class="cal-title-btn" data-cal="title" type="button">'+names[month]+" "+year+"</button>";
  html+='<div class="cal-navs">';
  html+='<button class="cal-nav cal-nav-up" data-cal="prev" type="button"></button>';
  html+='<button class="cal-nav cal-nav-down" data-cal="next" type="button"></button>';
  html+='</div></div><div class="calendar-weekdays">';
  for(i=0;i<week.length;i++){html+="<span>"+week[i]+"</span>"}
  html+='</div><div class="calendar-days">';
  for(i=0;i<42;i++){
    cell=new Date(firstCell.getFullYear(),firstCell.getMonth(),firstCell.getDate()+i);
    cls="calendar-day";
    if(cell.getMonth()!==month){cls+=" other-month"}
    if(selected&&sameDate(selected,cell)){cls+=" selected"}
    html+='<button class="'+cls+'" data-date="'+formatDate(cell)+'" type="button">'+cell.getDate()+"</button>"
  }
  html+='</div><div class="calendar-foot">';
  html+='<button class="cal-link" data-cal="clear" type="button">Clear</button>';
  html+='<button class="cal-link" data-cal="today" type="button">Today</button></div>';
  popup.innerHTML=html
}
function renderRequestYears(popup){
  var names=monthNames();
  var shortNames=shortMonthNames();
  var draft=draftById(state.calendarRowId);
  var selected=parseDate(draft?draft[state.calendarField]:"");
  var month=state.calendarDate.getMonth();
  var year=state.calendarYear;
  var minYear=year-5;
  var maxYear=year+8;
  var html='<div class="calendar-head">';
  var y,m,cls;
  html+='<button class="cal-title-btn" data-cal="title" type="button">'+names[month]+" "+year+"</button>";
  html+='<div class="cal-navs"></div></div><div class="year-panel">';
  for(y=minYear;y<=maxYear;y++){
    html+='<div class="year-row'+(y===year?' active':'')+'">';
    html+='<button class="year-btn" data-year="'+y+'" type="button">'+y+"</button>";
    if(y===year){
      html+='<div class="month-grid">';
      for(m=0;m<12;m++){
        cls="month-btn";
        if(selected&&selected.getFullYear()===y&&selected.getMonth()===m){cls+=" selected"}
        html+='<button class="'+cls+'" data-month="'+m+'" type="button">'+shortNames[m]+"</button>"
      }
      html+="</div>"
    }
    html+="</div>"
  }
  popup.innerHTML=html;
  scrollRequestYear(popup)
}
function scrollRequestYear(popup){
  var panel=popup.getElementsByClassName("year-panel")[0];
  var active=popup.getElementsByClassName("year-row active")[0];
  if(panel&&active){panel.scrollTop=Math.max(0,active.offsetTop-34)}
}
function openRequestCalendar(rowId,field){
  var draft=draftById(rowId);
  var parsed=draft?parseDate(draft[field]):null;
  var popup;
  closeRequestCalendars();
  state.calendarRowId=String(rowId);
  state.calendarField=field;
  if(parsed){state.calendarDate=parsed}
  else{state.calendarDate=new Date()}
  state.calendarYear=state.calendarDate.getFullYear();
  state.calendarMode="days";
  popup=calendarPopup(state.calendarRowId,field);
  if(popup){popup.className="request-calendar open"}
  renderRequestCalendar()
}
function setDraftField(rowId,key,value){
  var draft=draftById(rowId);
  if(draft&&!draft.requestNo){draft[key]=value}
}
function parseAmountValue(value){
  var text=String(value==null?"":value).replace(/,/g,"").replace(/^\s+|\s+$/g,"");
  var match=text.match(/^([+-]?(?:\d+(?:\.\d+)?|\.\d+))\s*(CR|K|L|M|B)?$/i);
  var multipliers=MODEL.amountMultipliers||{};
  var number,suffix,multiplier;
  if(!match){return null}
  number=Number(match[1]);
  suffix=String(match[2]||"").toUpperCase();
  multiplier=suffix?Number(multipliers[suffix]||0):1;
  if(!multiplier){return null}
  number=number*multiplier;
  if(!isFinite(number)||number<=0){return null}
  return number
}
function convertAmountInput(input){
  var rowId=input.getAttribute("data-row-id");
  var number=parseAmountValue(input.value);
  if(number===null){return}
  setDraftField(rowId,"amount",number);
  input.value=money(number)
}
function applyRequestVariant(row,requestType){
  row.requestType=requestType
}
function addRequestRow(){
  var record=findRowById(state.activeRecordId);
  if(!record){return}
  closeRequestCalendars();
  state.requestDrafts.push(newRequestDraft(record));
  renderRequestTable()
}
function openRequestModal(){
  var record=selectedRow();
  var source,i,copy,added=false;
  if(!record){return}
  state.activeRecordId=record.id;
  state.requestDrafts=[];
  state.requestDraftSeq=1;
  source=record.requestRows[0]||{};
  if(recordHasRequest(record)){
    for(i=0;i<record.requestRows.length;i++){
      if(!record.requestRows[i].requestNo){continue}
      copy=cloneRequestRow(record.requestRows[i]);
      state.requestDrafts.push(copy);
      added=true
    }
    if(!added){
      copy=cloneRequestRow(source);
      copy.requestNo=record.requestNo||copy.requestNo;
      state.requestDrafts.push(copy)
    }
  }else{
    state.requestDrafts.push(newRequestDraft(record))
  }
  renderBasicDetails(record);
  renderRequestTable();
  byId("requestModal").className="modal-bg open"
}
function closeRequestModal(){
  closeRequestCalendars();
  byId("requestModal").className="modal-bg";
  state.activeRecordId=null;
  state.requestDrafts=[]
}
function nextRequestNumber(){
  var used={};
  var i,j,row,variants,k;
  var candidate=Number(MODEL.requestNumber.start||1);
  var step=Number(MODEL.requestNumber.step||1);
  for(i=0;i<DATA.length;i++){
    if(DATA[i].requestNo){used[String(DATA[i].requestNo)]=true}
    for(j=0;j<DATA[i].requestRows.length;j++){
      row=DATA[i].requestRows[j];
      if(row.requestNo){used[String(row.requestNo)]=true}
      variants=row.variants||[];
      for(k=0;k<variants.length;k++){
        if(variants[k].requestNo){used[String(variants[k].requestNo)]=true}
      }
    }
  }
  while(used[String(candidate)]){candidate+=step}
  return String(candidate)
}
function requiredFieldsMissing(row){
  var missing=[];
  if(!parseDate(row.startDate)){missing.push("Start Date")}
  if(!parseDate(row.endDate)){missing.push("End Date")}
  if(!parseDate(row.expEndDate)){missing.push("Exp. End Date")}
  if(parseAmountValue(row.amount)===null){missing.push("Amount")}
  if(!String(row.companyCode||"").replace(/^\s+|\s+$/g,"")){missing.push("Co.Code")}
  return missing
}
function persistCreatedDraft(record,draft){
  var saved=cloneRequestRow(draft);
  var i,hasCreated=false;
  for(i=0;i<record.requestRows.length;i++){
    if(record.requestRows[i].requestNo){hasCreated=true;break}
  }
  if(!hasCreated){record.requestRows=[saved]}
  else{record.requestRows.push(saved)}
}
function createRequest(rowId){
  var record=findRowById(state.activeRecordId);
  var draft=draftById(rowId);
  var requestNo,missing,amount;
  if(!record||!draft||draft.requestNo){return}
  missing=requiredFieldsMissing(draft);
  if(missing.length){
    toast("Please fill "+missing.join(", ")+" before creating the request.","Information","i");
    setStatus("Please fill all required request fields");
    return
  }
  amount=parseAmountValue(draft.amount);
  draft.amount=amount;
  requestNo=nextRequestNumber();
  draft.requestNo=requestNo;
  persistCreatedDraft(record,draft);
  if(!record.requestNo){record.requestNo=requestNo}
  renderRequestTable();
  renderTable();
  toast("Request No "+requestNo+" created successfully.");
  setStatus("Request No "+requestNo+" created successfully")
}
ensureDisplayValues();
renderStructureOptions();

  byId("ottkFilter").value="";
  byId("entityFilter").value="";

};

  refreshFilters();

};

byId("entityDropBtn").onclick=function(){

  byId("ottkFilter").value="";
  byId("entityFilter").value="";
  byId("dealFilter").value="";
  byId("statusFilter").value="";
  closeAllCombos();

byId("mainBody").onclick=function(e){
  var target=e.target||e.srcElement;
  var row=target;
  var id;
  while(row&&row.tagName&&row.tagName.toLowerCase()!=="tr"){row=row.parentNode}
  if(!row){return}
  id=row.getAttribute("data-id");
  if(!id){return}
  state.selectedId=id;
  renderTable()
};
byId("paginationBar").onclick=function(e){
  var target=e.target||e.srcElement;
  var page=target.getAttribute("data-page");
  var rows,pages;
  if(!page||target.disabled){return}
  rows=getFilteredRows();
  pages=Math.max(1,Math.ceil(rows.length/state.pageSize));
  if(page==="prev"){state.page=Math.max(1,state.page-1)}
  else if(page==="next"){state.page=Math.min(pages,state.page+1)}
  else{state.page=parseInt(page,10)||1}
  clearSelection();
  renderTable()
};
byId("createRequestBtn").onclick=openRequestModal;
byId("requestAddRow").onclick=addRequestRow;
byId("requestClose").onclick=closeRequestModal;
byId("requestDone").onclick=closeRequestModal;
byId("requestBody").onclick=function(e){
  var target=e.target||e.srcElement;
  var rowId=target.getAttribute("data-create-row");
  var calendarRow=target.getAttribute("data-row-id");
  var field=target.getAttribute("data-calendar-field");
  var nav=target.getAttribute("data-cal");
  var date=target.getAttribute("data-date");
  var year=target.getAttribute("data-year");
  var month=target.getAttribute("data-month");
  if(rowId){createRequest(rowId);return}
  if(field&&calendarRow){openRequestCalendar(calendarRow,field);return}
  if(!state.calendarField||!state.calendarRowId){return}
  if(nav==="prev"){
    state.calendarDate.setMonth(state.calendarDate.getMonth()-1);
    state.calendarYear=state.calendarDate.getFullYear();
    renderRequestCalendar();
    return
  }
  if(nav==="next"){
    state.calendarDate.setMonth(state.calendarDate.getMonth()+1);
    state.calendarYear=state.calendarDate.getFullYear();
    renderRequestCalendar();
    return
  }
  if(nav==="title"){
    state.calendarMode=state.calendarMode==="days"?"years":"days";
    state.calendarYear=state.calendarDate.getFullYear();
    renderRequestCalendar();
    return
  }
  if(nav==="clear"){
    setDraftField(state.calendarRowId,state.calendarField,"");
    closeRequestCalendars();
    renderRequestTable();
    return
  }
  if(nav==="today"){
    setDraftField(state.calendarRowId,state.calendarField,formatDate(new Date()));
    closeRequestCalendars();
    renderRequestTable();
    return
  }
  if(year!==null&&year!==""){
    state.calendarYear=Number(year);
    state.calendarDate.setFullYear(state.calendarYear);
    state.calendarMode="years";
    renderRequestCalendar();
    return
  }
  if(month!==null&&month!==""){
    state.calendarDate=new Date(state.calendarYear,Number(month),1);
    state.calendarMode="days";
    renderRequestCalendar();
    return
  }
  if(date){
    setDraftField(state.calendarRowId,state.calendarField,date);
    closeRequestCalendars();
    renderRequestTable()
  }
};
byId("requestBody").onchange=function(e){
  var target=e.target||e.srcElement;
  var rowId=target.getAttribute("data-request-type");
  var field=target.getAttribute("data-request-field");
  var inputRow=target.getAttribute("data-row-id");
  var draft;
  if(rowId){
    draft=draftById(rowId);
    if(draft&&!draft.requestNo){applyRequestVariant(draft,target.value)}
    return
  }
  if(field&&inputRow){setDraftField(inputRow,field,target.value)}
};
byId("requestBody").onkeyup=function(e){
  var target=e.target||e.srcElement;
  var field=target.getAttribute("data-request-field");
  var rowId=target.getAttribute("data-row-id");
  if(field&&rowId){setDraftField(rowId,field,target.value)}
};
byId("requestBody").onkeydown=function(e){
  var event=e||window.event;
  var target=event.target||event.srcElement;
  if(event.keyCode===13&&target.getAttribute("data-request-field")==="amount"){
    if(event.preventDefault){event.preventDefault()}
    event.returnValue=false;
    convertAmountInput(target);
    return false
  }
  return true
};
document.onkeydown=function(e){
  var event=e||window.event;
  if(event.keyCode===27){
    closeAllCombos();
    closeRequestCalendars();
    closeRequestModal()
  }
  return true
};
})();
