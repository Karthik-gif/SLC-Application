<style type="text/css">

.filter-xs{width:100px;max-width:100px}

.btn-icon{width:30px;height:30px;padding:0;border:1px solid #d1e8ff;border-radius:4px;background:#eaf3fc;color:#004b93;

.btn-icon:hover{background:#d1e8ff;border-color:#0a6ed1}
.pagination-bar{display:flex;align-items:center;justify-content:flex-end;gap:5px;padding:8px 10px;background:#fff;

.page-btn{min-width:30px;height:28px;padding:0 8px;border:1px solid #d9d9d9;border-radius:4px;background:#fff;color:#1d2d3e;

.stat-label{color:#556b82;font-size:11px;font-weight:400;white-space:nowrap}
.stat-value{color:#1d2d3e;font-size:13px;font-weight:600;white-space:nowrap}
.input-error{border-color:#bb0000!important;box-shadow:0 0 0 1px #bb0000}
.data-table td.amount{font-weight:600}
.data-table td.amount-pos{color:#107e3e}
.data-table td.amount-neg{color:#bb0000}
.row-action-btn{height:26px;padding:0 10px;font-size:11px}
.link-button{border:0;background:transparent;color:#0a6ed1;text-decoration:none;padding:0;font-size:12px;

.link-button:hover:not(:disabled){text-decoration:underline}
.link-button:disabled{color:#9aa7b4;text-decoration:none;cursor:default;opacity:1}
.link-icon{font-size:12px;line-height:1}
.modal-bg{display:none;position:fixed;inset:0;z-index:2000;background:rgba(29,45,62,.30);padding:28px 18px;overflow:auto}
.modal-bg.open{display:block}
#confirmModal.open{display:flex;align-items:center;justify-content:center}
#confirmModal .modal{margin:0;width:400px;max-width:90vw}
.confirm-text{font-size:13px;color:#1d2d3e;line-height:18px;white-space:nowrap;padding:6px 0}
.modal{max-width:940px;margin:0 auto;background:#fff;border:1px solid #d9d9d9;border-radius:8px;
box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden}
.modal.small{max-width:540px}
.modal.large{max-width:1180px}
.modal-head{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#eaf3fc;
border-bottom:1px solid #d1e8ff}
.modal-title{font-size:13px;font-weight:600}
.modal-close{width:28px;height:28px;border:1px solid #d9d9d9;border-radius:4px;background:#fff;color:#556b82}
.modal-body{padding:14px;max-height:76vh;overflow:auto}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:7px;padding:10px 14px;background:#f7f8f9;
border-top:1px solid #d9d9d9}
.toast-region{position:fixed;right:22px;bottom:28px;z-index:4000;width:350px;max-width:calc(100% - 44px)}
.toast{display:flex;gap:10px;margin-top:8px;padding:12px 14px;background:#f2f4f5;border:1px solid #d9d9d9;
border-left:3px solid #a8b3bd;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.toast.success{border-left-color:#107e3e}.toast.error{border-left-color:#bb0000}.toast.warning{border-left-color:#e9730c}
.toast-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#e5e8eb;
color:#556b82;font-weight:600}
.toast.success .toast-icon{background:#ebf5eb;color:#107e3e}
.toast-title{margin-bottom:2px;font-size:12px;font-weight:600}
.toast-message{color:#556b82;font-size:12px;line-height:17px}
.statusbar{position:fixed;left:0;right:0;bottom:0;height:20px;display:flex;align-items:center;padding:0 12px;background:#fff;
border-top:1px solid #e1e6ea;color:#6a6d70;font-size:11px;z-index:900}
.status-dot{width:7px;height:7px;margin-right:6px;border-radius:50%;background:#0a6ed1}
.screen{display:none}
.screen.active{display:block}
@media screen and (max-width:980px){
.detail-grid{grid-template-columns:1fr}.content{padding-left:8px;padding-right:8px}
.field{grid-template-columns:130px minmax(0,1fr)}
.irs-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media screen and (max-width:640px){
.topbar-inner{padding:0 10px}.content{padding-top:8px}
.field,.detail-line{grid-template-columns:1fr;gap:3px}.input,.select{max-width:none}.actions{justify-content:stretch}
.detail-value.size-xs,.detail-value.size-sm,.detail-value.size-md,.detail-value.size-lg{width:100%}
.detail-control-xs,.detail-control-sm,.detail-control-md{width:100%!important;max-width:none!important}
.actions .btn{flex:1}.toolbar{align-items:flex-start}.toolbar-left,.toolbar-right{width:100%}
.selection-main-row{flex-wrap:wrap;overflow-x:visible}
.structure-field,.cc-field,.date-field{width:100%}

.filter-body.open{flex-wrap:wrap}
.filter-item{width:100%}
.filter-xs,.filter-sm,.filter-md,.filter-lg{width:100%;max-width:none}
.twin-input-wrap{max-width:none}
.date-input-wrap.compact{width:100%;max-width:none}

.title-wrap{display:flex;align-items:center;gap:10px}

<body>
<div class="shell">
  <div class="topbar">

        <div class="title" id="screenTitle">View Discounting Loans and Create IRS</div>

    </div>
  </div>
  <div class="content">
    <div id="listScreen" class="screen active">

              </div>
            </div>
            <button id="filterToggle" class="filter-icon-btn" type="button" title="Filters" aria-label="Filters"></button>

              <div class="filter-item">
                <select id="dealIdFilter" class="select filter-md"></select>
              </div>
              <div class="filter-item">
                <select id="discTxnFilter" class="select filter-md"></select>
              </div>
              <div class="filter-item">
                <select id="statusFilter" class="select filter-lg"></select>
              </div>

          </div>
          <div class="toolbar-right"></div>
        </div>
        <div class="card table-card">
          <div class="card-head">
            <div class="card-title">Discounting Loan Overview</div>
            <div class="card-meta" id="rowCountMeta"></div>
          </div>
          <div class="table-wrap">
            <table id="mainTable" class="data-table">
              <thead id="mainHead"></thead>
              <tbody id="mainBody"></tbody>
            </table>
          </div>
          <div id="paginationBar" class="pagination-bar"></div>
        </div>
      </div>
    </div>
    <div id="cashflowScreen" class="screen">
      <div class="card">
        <div class="card-head">
          <div class="card-title">Discounting Loan Details</div>
          <div class="card-meta">Selected Record</div>
        </div>
        <div id="loanDetailBody" class="card-body"></div>
      </div>
      <div class="card">
        <div class="card-head">
          <div class="card-title">IRS Details</div>
          <button id="createIrsBtn" class="btn btn-primary" type="button">Create IRS</button>
        </div>
        <div id="irsDetailBody" class="card-body"></div>
      </div>
      <div id="cashflowTableCard" class="card table-card" style="display:none">
        <div class="card-head">
          <div class="card-title">Cashflow Details</div>
          <div class="card-meta" id="cashflowCountMeta"></div>
        </div>
        <div class="table-wrap">
          <table id="cashflowTable" class="data-table">
            <thead id="cashflowHead"></thead>
            <tbody id="cashflowBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="cashflowPopup" class="modal-bg">
  <div class="modal large">
    <div class="modal-head">
      <div class="modal-title" id="cashflowPopupTitle">Cashflow Details</div>
      <button id="cashflowPopupClose" class="modal-close" type="button">X</button>

        <div class="card-head">

</div>

<div id="toastRegion" class="toast-region" aria-live="polite"></div>
<div class="statusbar"><span class="status-dot"></span><span id="statusText">Ready</span></div>

function money(value){

function pad2(n){return (n<10?"0":"")+n}
function isValidDMY(s){
  var m=String(s||"").match(/^(\d{2})-(\d{2})-(\d{4})$/);
  if(!m){return false}
  var day=Number(m[1]),month=Number(m[2]),year=Number(m[3]);
  if(month<1||month>12||day<1||day>31||year<1000||year>9999){return false}
  var d=new Date(year,month-1,day);
  return d.getFullYear()===year&&d.getMonth()===month-1&&d.getDate()===day
}
function parseDMY(s){
  if(!isValidDMY(s)){return null}
  var m=String(s).match(/^(\d{2})-(\d{2})-(\d{4})$/);
  return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]))
}
function formatDMY(d){return pad2(d.getDate())+"-"+pad2(d.getMonth()+1)+"-"+d.getFullYear()}
function validateDateInput(el){
  var v=el.value;
  if(v===""){el.className="input";return true}
  if(isValidDMY(v)){el.className="input";return true}
  el.className="input input-error";
  toast("Invalid date \""+v+"\". Please use DD-MM-YYYY format.","warning");
  return false
}

}

  }
}
function addDaysDMY(s,days){
  var d=parseDMY(s);
  if(!d){return s}
  d.setDate(d.getDate()+Number(days||0));
  return formatDMY(d)
}
function diffDaysDMY(startS,endS){
  var a=parseDMY(startS),b=parseDMY(endS);
  if(!a||!b){return 0}
  return Math.round((b.getTime()-a.getTime())/86400000)
}
function isoToDMY(iso){
  var m=String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m){return iso||""}
  return m[3]+"-"+m[2]+"-"+m[1]
}

function calcInterestDue(amount,rate,days){return (Number(amount)||0)*(Number(rate)||0)*(Number(days)||0)/36000}

  var ths=document.querySelectorAll("#mainHead th[data-index]"),i;
  for(i=0;i<ths.length;i++){ths[i].className=""}
  if(ths[index]){ths[index].className=direction==="asc"?"sort-asc":"sort-desc"}
}
function sortData(index){
  var col=MAIN_COLUMNS[index],direction;
  direction=state.sort.index===index&&state.sort.direction==="asc"?"desc":"asc";
  state.sort={index:index,direction:direction};
  DATA.records.sort(function(a,b){
    var av=col.compute?col.compute(a):a[col.key],bv=col.compute?col.compute(b):b[col.key];
    if(col.number){av=Number(av||0);bv=Number(bv||0)}
    else{av=String(av||"").toLowerCase();bv=String(bv||"").toLowerCase()}
    if(av<bv){return direction==="asc"?-1:1}
    if(av>bv){return direction==="asc"?1:-1}
    return 0
  });
  state.listPage=1;
  renderMainList();
  applySortClass(index,direction)
}

function renderPagination(totalRows){
  var bar=byId("paginationBar"),pages=Math.max(1,Math.ceil(totalRows/state.pageSize)),html="",startPage,endPage,p;
  if(state.listPage>pages){state.listPage=pages}
  html+='<button class="page-btn" data-page="prev" type="button"'+(state.listPage===1?' disabled="disabled"':'')+
    '>Previous</button>';
  startPage=Math.max(1,state.listPage-1);
  endPage=Math.min(pages,startPage+2);
  startPage=Math.max(1,endPage-2);
  for(p=startPage;p<=endPage;p++){
    html+='<button class="page-btn'+(p===state.listPage?' active':'')+'" data-page="'+p+'" type="button">'+p+'</button>'
  }
  html+='<button class="page-btn" data-page="next" type="button"'+(state.listPage===pages?' disabled="disabled"':'')+
    '>Next</button>';
  bar.innerHTML=html;
  bar.onclick=function(e){
    var target=e.target||e.srcElement,page=target.getAttribute("data-page");
    if(!page||target.disabled){return}
    if(page==="prev"){state.listPage-=1}
    else if(page==="next"){state.listPage+=1}
    else{state.listPage=parseInt(page,10)||1}
    renderMainList()
  }
}

  return '<div class="irs-field"><label>'+esc(label)+'</label><div class="twin-input-wrap">'+
    '<input id="'+id1+'" class="input" type="text" value="'+esc(value1)+'">'+
    '<input id="'+id2+'" class="input" type="text" value="'+esc(value2)+'"></div></div>'
}
function openCashflowScreen(r){
  state.selectedDealId=r.dealId;
  state.screen="cashflow";
  byId("screenTitle").innerHTML="All Cashflow Details";
  byId("listScreen").className="screen";
  byId("cashflowScreen").className="screen active";
  byId("backToListBtn").style.display="inline-flex";
  renderLoanDetail(r);
  renderIrsDetail(r);
  byId("cashflowTableCard").style.display="none";
  byId("cashflowCountMeta").innerHTML="";
  if(r.irsTxn){
    var irs=irsFromRecord(r);
    state.cashflowRows=generateCashflow(r,irs);
    renderCashflowTable()
  }else{
    state.cashflowRows=[]
  }
}
function irsFromRecord(r){
  return {
    coCode:r.companyCode,partnerId:"",partnerName:r.partnerName,startDate:r.startDate,endDate:r.endDate,
    incomingRef1:r.refInterestRate,incomingRef2:r.spreadRate,outgoingIntCat:"01",
    outgoingIntFrq:r.resetFrequency,interestPaymentDate:"Start of Period",specialCase:r.specialCase,
    outgoingRate1:r.refInterestRate,outgoingRate2:r.spreadRate
  }
}
byId("backToListBtn").onclick=function(){
  state.screen="list";
  byId("screenTitle").innerHTML="View Discounting Loans and Create IRS";
  byId("cashflowScreen").className="screen";
  byId("listScreen").className="screen active";
  byId("backToListBtn").style.display="none";
  renderMainList()
};
function loanDetailStatRowHtml(r){
  return '<div class="stat-row">'+
    statItem("Deal ID",r.dealId)+
    statItem("Transaction No.",r.discLoanTxn)+
    statItem("BP Name",r.bankName)+
    statItem("Start Date",r.startDate)+
    statItem("End Date",r.endDate)+
    statItem("Ref. Int. Rate",rateFmt(r.refInterestRate))+
    statItem("Reset Frequency",r.resetFrequency)+
    statItem("Accounting Type",r.accountingType)+
    statItem("Special Case",r.specialCase)+
    '</div>'
}
function renderLoanDetail(r){
  byId("loanDetailBody").innerHTML=loanDetailStatRowHtml(r)
}
function renderIrsDetail(r){
  var already=!!r.irsTxn,html='<div class="irs-grid">';
  html+=selectFieldRow("irsCoCode","IRS Co Code",DATA.companyCodes,"code",null,r.companyCode);
  html+=fieldRow("irsTransactionNo","IRS Transaction","text",r.irsTxn,true);
  html+=selectFieldRow("irsBp","IRS BP",DATA.partners,"name",null,already?r.partnerName:r.bankName);
  html+=dateFieldRow("irsStartDate","Start Date",r.startDate);
  html+=dateFieldRow("irsEndDate","End Date",r.endDate);
  html+=twinFieldRow("incomingRef1","incomingRef2","Incoming Int Ref",
    rateFmt(r.refInterestRate),rateFmt(r.spreadRate));
  html+=selectFieldRow("outgoingIntCat","Outgoing Int Cat",DATA.enums.outgoingIntCat,"code","label",
    already?"01":"");
  html+='<div id="outgoingRateWrap"></div>';
  html+=selectFieldRow("outgoingIntFrq","Outgoing Int Frq",DATA.enums.outgoingIntFrq,null,null,
    already?r.resetFrequency:"");
  html+=selectFieldRow("interestPaymentDate","Interest Payment Date",DATA.enums.interestPaymentDate,null,null,"");
  html+=selectFieldRow("irsSpecialCase","Special Case",DATA.enums.specialCase,null,null,
    already?r.specialCase:"");
  html+="</div>";
  byId("irsDetailBody").innerHTML=html;
  byId("outgoingIntCat").onchange=renderOutgoingRateFields;
  renderOutgoingRateFields();
  bindDateField("irsStartDate");
  bindDateField("irsEndDate");
  var lockIds=["irsCoCode","irsBp","irsStartDate","irsEndDate","incomingRef1","incomingRef2","outgoingIntCat",
    "outgoingIntFrq","interestPaymentDate","irsSpecialCase"],i,el;
  if(already){
    for(i=0;i<lockIds.length;i++){
      el=byId(lockIds[i]);
      el.disabled=true;
      if(el.tagName.toLowerCase()==="input"){el.className+=" detail-readonly-input"}
      if(byId(lockIds[i]+"Native")){byId(lockIds[i]+"Native").disabled=true}
    }
    byId("createIrsBtn").disabled=true
  }else{
    byId("createIrsBtn").disabled=false
  }
}
function renderOutgoingRateFields(){
  var cat=byId("outgoingIntCat").value,wrap=byId("outgoingRateWrap"),html="";
  if(cat==="01"){
    html=fieldRow("outgoingRate1","Outgoing Int Rate","text","",false)
  }else if(cat==="02"){
    html='<div class="irs-field"><label>Outgoing Int Rate</label><div class="twin-input-wrap">'+
      '<input id="outgoingRate1" class="input" type="text" value="">'+
      '<input id="outgoingRate2" class="input" type="text" value=""></div></div>'
  }
  wrap.innerHTML=html
}
function genIrsTxnNo(){return "IRSTX"+Math.floor(80000+Math.random()*19999)}
byId("createIrsBtn").onclick=function(){
  var r=selectedRecord();
  if(!r){return}
  var coCode=byId("irsCoCode").value,bp=byId("irsBp").value;
  var startDate=byId("irsStartDate").value,endDate=byId("irsEndDate").value;
  var incomingRef1=byId("incomingRef1").value,incomingRef2=byId("incomingRef2").value;
  var outgoingIntCat=byId("outgoingIntCat").value,outgoingIntFrq=byId("outgoingIntFrq").value;
  var interestPaymentDate=byId("interestPaymentDate").value,specialCase=byId("irsSpecialCase").value;
  var outgoingRate1=byId("outgoingRate1")?byId("outgoingRate1").value:"";
  var outgoingRate2=byId("outgoingRate2")?byId("outgoingRate2").value:"";
  if(!coCode||!bp||!parseDMY(startDate)||!parseDMY(endDate)||!incomingRef1||!incomingRef2||!outgoingIntCat||
    !outgoingIntFrq||!interestPaymentDate||!specialCase||!outgoingRate1){
    toast("Please fill all required IRS fields before creating.","warning");
    return
  }
  if(outgoingIntCat==="02"&&!outgoingRate2){
    toast("Please fill both Outgoing Int Rate values.","warning");
    return
  }
  var irsTxn=genIrsTxnNo();
  r.irsId="IRS"+Math.floor(4000+Math.random()*999);
  r.irsCompanyName=DATA.companyCodes.filter(function(c){return c.code===coCode})[0].name;
  r.irsTxn=irsTxn;
  r.partnerName=bp;
  byId("irsTransactionNo").value=irsTxn;
  toast("IRS transaction created successfully: "+irsTxn,"success");
  setStatus("IRS transaction created: "+irsTxn);
  var irs={
    coCode:coCode,partnerName:bp,startDate:startDate,endDate:endDate,
    incomingRef1:incomingRef1,incomingRef2:incomingRef2,outgoingIntCat:outgoingIntCat,
    outgoingIntFrq:outgoingIntFrq,interestPaymentDate:interestPaymentDate,specialCase:specialCase,
    outgoingRate1:outgoingRate1,outgoingRate2:outgoingRate2
  };
  state.cashflowRows=generateCashflow(r,irs);
  renderCashflowTable();
  renderIrsDetail(r);
  renderMainList()
};
function frqStepDays(frq){
  if(frq==="Monthly"){return 30}
  if(frq==="Quarterly"){return 90}
  if(frq==="Half Yearly"){return 180}
  return 0
}
function generateCashflow(r,irs){
  if(r.exampleCashflow){return r.exampleCashflow}
  var rows=[],notional=r.discLoanAmount,loanRate=calcInterestRate(r);
  rows.push({paymentDate:r.startDate,name:r.bankName,discLoan:notional,irsIncoming:notional,
    irsOutgoing:-notional,curr:r.currency,flowType:"Notional Exchange",intFixDate:r.startDate,
    status:"-",pctRate:0,adjStatus:"Fixed"});
  var outgoingRate=Number(irs.outgoingRate1||0)+Number(irs.outgoingRate2||0);
  var incomingRate=Number(irs.incomingRef1||0)+Number(irs.incomingRef2||0);
  var frq=irs.outgoingIntFrq,step=frqStepDays(frq),adjStatus=irs.outgoingIntCat==="02"?"Not fixed":"Fixed";
  if(frq==="Upfront"){
    pushInterestRow(rows,r,irs,r.startDate,r.startDate,0,loanRate,incomingRate,outgoingRate,adjStatus)
  }else if(frq==="Rear End"){
    pushInterestRow(rows,r,irs,r.endDate,r.endDate,diffDaysDMY(r.startDate,r.endDate),
      loanRate,incomingRate,outgoingRate,adjStatus)
  }else if(step>0){
    var cur=irs.startDate,prev=irs.startDate;
    while(parseDMY(cur)&&parseDMY(cur).getTime()<parseDMY(irs.endDate).getTime()){
      cur=addDaysDMY(cur,step);
      if(parseDMY(cur).getTime()>parseDMY(irs.endDate).getTime()){cur=irs.endDate}
      pushInterestRow(rows,r,irs,cur,cur,diffDaysDMY(prev,cur),loanRate,incomingRate,outgoingRate,adjStatus);
      prev=cur;
      if(cur===irs.endDate){break}
    }
  }
  rows.push({paymentDate:r.endDate,name:r.bankName,discLoan:-notional,irsIncoming:notional,
    irsOutgoing:-notional,curr:r.currency,flowType:"Notional Exchange",intFixDate:r.endDate,
    status:"-",pctRate:100,adjStatus:"Fixed"});
  return rows
}
function pushInterestRow(rows,r,irs,paymentDate,fixDate,days,loanRate,incomingRate,outgoingRate,adjStatus){
  var notional=r.discLoanAmount;
  var loanInterest=calcInterestDue(notional,loanRate,days||0);
  var incomingAmt=calcInterestDue(notional,incomingRate,days||0);
  var outgoingAmt=calcInterestDue(notional,outgoingRate,days||0);
  rows.push({paymentDate:paymentDate,name:irs.partnerName,discLoan:-loanInterest,irsIncoming:incomingAmt,
    irsOutgoing:-outgoingAmt,curr:r.currency,flowType:"Interest",intFixDate:fixDate,
    status:"Planned",pctRate:outgoingRate,adjStatus:adjStatus})
}
var CASHFLOW_COLUMNS=[
  {key:"paymentDate",label:"Payment Date",width:110},
  {key:"name",label:"Description",width:150,center:true,compute:function(row){return descriptionFor(row)}},
  {key:"discLoan",label:"Disc Loan",width:130,number:true,amount:true},
  {key:"irsIncoming",label:"IRS Incoming",width:130,number:true,amount:true},
  {key:"irsOutgoing",label:"IRS Outgoing",width:130,number:true,amount:true},
  {key:"curr",label:"Curr",width:70},
  {key:"intFixDate",label:"Int. Fix. Date",width:120},
  {key:"pctRate",label:"Percentage Rate",width:145,number:true,rate:true},
  {key:"adjStatus",label:"Int. Rate Adj. Status",width:175,center:true}
];
function descriptionFor(row){
  var ft=String(row.flowType||"");
  if(ft.indexOf("Notional")>=0||ft.indexOf("Drawdown")>=0||ft.indexOf("Repayment")>=0){return "Principal"}
  return "IRS Interest"
}
function amountColorClass(val){
  var n=Number(val||0);
  if(n>0){return " amount-pos"}
  if(n<0){return " amount-neg"}
  return ""
}
function amountDisplay(val){
  var n=Number(val||0);
  if(n>0){return "+"+money(n)}
  return money(n)
}
function cashflowBodyHtml(rows){
  var html="",i,j,c,val,display,cls;
  for(i=0;i<rows.length;i++){
    html+="<tr>";
    for(j=0;j<CASHFLOW_COLUMNS.length;j++){
      c=CASHFLOW_COLUMNS[j];
      val=c.compute?c.compute(rows[i]):rows[i][c.key];
      if(c.rate){display=esc(rateFmt(val))}
      else if(c.amount){display=esc(amountDisplay(val))}
      else if(c.number){display=esc(money(val))}
      else{display=esc(val)}
      cls=(c.number?"number":"")+(c.amount?" amount"+amountColorClass(val):"")+(c.center?" center":"");
      html+='<td class="'+cls+'">'+display+'</td>'
    }
    html+="</tr>"
  }
  if(!html){html='<tr><td colspan="'+CASHFLOW_COLUMNS.length+'" class="empty">No cashflow rows generated.</td></tr>'}
  return html
}
function renderCashflowTable(){
  var rows=state.cashflowRows;
  byId("cashflowHead").innerHTML=headerHtml(CASHFLOW_COLUMNS);
  byId("cashflowBody").innerHTML=cashflowBodyHtml(rows);
  byId("cashflowTableCard").style.display="block";
  byId("cashflowCountMeta").innerHTML=esc(rows.length+" row(s)")
}
function openCashflowPopup(r){
  var irs=irsFromRecord(r),rows=generateCashflow(r,irs),i,c,cls,plainHead="<tr>";
  byId("popupLoanDetailBody").innerHTML=loanDetailStatRowHtml(r);
  for(i=0;i<CASHFLOW_COLUMNS.length;i++){
    c=CASHFLOW_COLUMNS[i];
    cls=(c.number?"number":"")+(c.center?" center":"");
    plainHead+='<th class="'+cls+'" style="width:'+(c.width||110)+'px">'+esc(c.label)+'</th>'
  }
  plainHead+="</tr>";
  byId("cashflowPopupTitle").innerHTML="Cashflow Details - "+esc(r.discLoanTxn);
  byId("popupCashflowHead").innerHTML=plainHead;
  byId("popupCashflowBody").innerHTML=cashflowBodyHtml(rows);
  byId("cashflowPopup").className="modal-bg open"
}
byId("cashflowPopupClose").onclick=function(){byId("cashflowPopup").className="modal-bg"};
function resetListScreen(){
  byId("keyDate").value="";
  byId("keyDate").className="input";
  byId("keyDateNative").value="";
  byId("dealIdFilter").value="";
  byId("discTxnFilter").value="";
  byId("statusFilter").value="";
  byId("filterBody").className="filter-body";
  byId("resultsArea").style.display="none";
  byId("mainBody").innerHTML="";
  byId("paginationBar").innerHTML="";
  byId("rowCountMeta").innerHTML="";
  state.selectedDealId="";
  state.listPage=1;
  disableActionButtons();
  setStatus("Ready - "+VERSION);
  toast("List screen has been refreshed.","success")
}
function resetCashflowScreen(){
  var r=selectedRecord();
  if(!r){setStatus("Ready - "+VERSION);toast("Nothing to refresh.","warning");return}
  openCashflowScreen(r);
  setStatus("Cashflow screen refreshed");
  toast("Cashflow screen has been refreshed.","success")
}
document.onkeydown=function(e){return true};
byId("refreshBtn").onclick=function(){
  if(state.screen==="cashflow"){resetCashflowScreen()}else{resetListScreen()}
};
initSelections();
byId("statusText").innerHTML="Ready - "+VERSION;
})();
</script>
